<!doctype html>
<html lang="en" data-theme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BattleLab dashboard simplification — editable before / after</title>
<!-- PRE-IMPLEMENTATION prototype. Representative, identical data in both variants.
     Palette below is copied verbatim from web/src/tokens.css; all layout styling uses tokens.
     Open this file directly. Controls: ?theme=light&view=mobile; ?mode=after&expanded=1.
     Product behavior: Needs you, Running sessions, Missions, Quota and the four overview cards mount initially. Optional content
     mounts when its disclosure opens. Actions and filters are visual placeholders here. -->
<style id="canonical-tokens">
/* Canonical BattleLab design tokens (#211) — the single source of the palette.
 *
 * Extracted from index.css (#829) so the docs site's theme can `@import` the SAME file the app
 * uses instead of carrying a second copy of the values: two palettes drifting apart is exactly
 * the failure this split exists to prevent. Nothing else moved — index.css still imports this
 * first and keeps every non-token rule.
 *
 * THREE selectors live here, not two: the bare `:root` IS the dark default, and
 * `:root[data-theme="dark"]` restates it for an explicit choice. They must stay identical —
 * pinned by theme/tokens.test.ts.
 *
 * (Originally: near-black ground, phosphor-amber accent, semantic-colour LEDs; rebranded from
 * the TermRoyale royal/indigo+gold theme — royal is retired and migrates to dark.)
 */
:root {
  color-scheme: dark;
  /* Canonical HUD tokens. */
  --bg-0: #0d0e10;
  --bg-1: #131418;
  --bg-2: #1a1c21;
  /* Terminal surface (#473): equals the xterm canvas background (themes.ts) per theme, so the
     wrapper slack FitAddon leaves below the last row is invisible in both themes. */
  --term-bg: #0d0e10;
  --text-1: #e8e9ec;
  --text-2: #a7abb3;
  --text-3: #6f747d;
  --glass: rgba(255, 255, 255, 0.022);
  --glass-strong: rgba(255, 255, 255, 0.035);
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.14);
  --accent: #ffb000; /* phosphor-amber brand — user-customizable (#211 Phase 2: a custom
                        accent overrides --accent + --on-accent inline on <html>; everything
                        below derives from them via color-mix, so the override cascades). */
  --on-accent: #120c00; /* ink ON the (light) amber accent — AA, locked by contrast.test */
  --accent-soft: color-mix(in srgb, var(--accent) 55%, transparent);
  --accent-glow: color-mix(in srgb, var(--accent) 22%, transparent);
  /* Semantic status — INDEPENDENT of the brand accent; never substitute the accent for these. */
  --status-up: #3fbf6f;
  --status-degraded: #f59e0b;
  --status-down: #c02020;
  --status-unknown: #6f747d;
  /* Unsent compose draft (#477) — a HUD blue, kept distinct from the green/amber/red status
     hues and the amber brand accent. Theme-shared like the other status tokens. */
  --status-draft: #3b9eff;

  /* Diff colours (#784) — derived, never hardcoded, so they follow the theme and the accent
     customisation like every other surface. Kept as their own names rather than reusing the status
     tokens directly: an added LINE is not a healthy STATUS, and conflating them would make a future
     status change silently repaint diffs. */
  /* Git status LETTERS are text, so they must clear AA — unlike the LEDs, which are dots and are
     deliberately left alone. Dark can use the status hues directly; light cannot (see below). */
  --git-add-fg: var(--status-up);
  --git-mod-fg: var(--status-degraded);
  --git-del-fg: color-mix(in srgb, var(--status-down) 55%, var(--text-1));
  /* Failure TEXT (form errors, over-cap counters). `--status-down` is a signal colour sized
     for LEDs and rules; as small text on a dark panel it measures 2.8:1, well under AA.
     Lightened toward --text-1 by the same 55% recipe as the git letters above, which keeps it
     recognisably the down hue at 5.5:1. Borders may still use the raw token — they are not
     text. Locked by contrast.test.ts. */
  --danger-text: color-mix(in srgb, var(--status-down) 55%, var(--text-1));
  /* The other two status hues as TEXT, by the same recipe and for the same reason (#889/#896).
     `--danger-text` existed because failure text needed it first; a healthy or degraded STATE
     rendered as a word needs it just as much, and reaching for `--git-add-fg` because it happens
     to be the right colour would name a git fact for a supervisor one. */
  --ok-text: color-mix(in srgb, var(--status-up) 60%, var(--text-1));
  --warn-text: color-mix(in srgb, var(--status-degraded) 60%, var(--text-1));
  --git-unknown-fg: color-mix(in srgb, var(--status-unknown) 75%, var(--text-1));
  --diff-add-bg: color-mix(in srgb, var(--status-up) 14%, transparent);
  --diff-add-fg: var(--status-up);
  --diff-del-bg: color-mix(in srgb, var(--status-down) 16%, transparent);
  --diff-del-fg: color-mix(in srgb, var(--status-down) 55%, var(--text-1));
  /* Syntax colours for the file editor (#950). Their own names, like the diff pair above: a
     keyword is not a status and not an interaction, so none of these reuses a --status-* hue or
     --accent — which would make a string read as "healthy" or a keyword as clickable. Plain hex
     so contrast.test.ts can hold every one at WCAG AA on --surface-3, the editor's ground. */
  --syn-keyword: #c4a7ff;
  --syn-string: #d9c7a0;
  --syn-number: #f2a8c4;
  --syn-comment: #8b9099;
  --syn-function: #e8e9ec;
  --syn-type: #8fd3c7;
  --syn-property: #b9bec7;
  --syn-punct: #a7abb3;
  --font-mono:
    "JetBrains Mono", "Cascadia Mono", "Fira Code", "SF Mono", ui-monospace,
    "Roboto Mono", Menlo, Consolas, monospace;
  /* Legacy app token names remapped onto the HUD palette so existing component CSS just works. */
  --bg: #0d0e10;
  --panel: #131418;
  --text: #e8e9ec;
  --text-muted: #a7abb3;
  --border: #25282e;
  --border-subtle: #191b20;
  --row-hover: #1c1f25;
  --surface-2: #1a1c21;
  --surface-3: #08090b;
  --brand: #ffb000;
  --brand-soft: #ffd47a;
  --badge-bg: #2a2310;
  --badge-fg: #ffd47a;
  /* CTA — follows the brand accent (#211 Phase 2): bg from --accent, the darker gradient
     stop via color-mix, ink from --on-accent. Default amber: --cta-text on --cta-bg-1 ≈ 11:1. */
  --cta-bg-1: var(--accent);
  --cta-bg-2: color-mix(in srgb, var(--accent) 85%, #000);
  --cta-text: var(--on-accent);
  font:
    14px/1.4 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
  /* Engine accents (#853 P4). A manifest names one of these by TOKEN (`display.accent`), never
     a hex, so an agent can only ever take a colour the design system has. Distinct from the
     status hues and the brand accent; slate is the neutral for a shell or an unknown engine.
     Held to >=3:1 on the chip grounds by contrast.test.ts. */
  --engine-amber: #d98a5c;
  --engine-teal: #4fd1c5;
  --engine-green: #7ee787;
  --engine-blue: #7aa2ff;
  --engine-lime: #c5e15a;
  --engine-magenta: #f472b6;
  --engine-slate: #8b98a5;
}

/* Theme presets (#211). The bare :root above is the DARK default (no attribute needed); the
 * data-theme override below swaps the token set for light. The `:root[data-theme=…]` form
 * (specificity 0,2,0) deterministically beats the bare :root. Interactive-text contrast is
 * held to WCAG AA (text/bg and --on-accent on --accent ≥4.5:1), locked by contrast.test.ts.
 * The accent is light (amber), so text that sits ON it uses dark --on-accent, never white. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-0: #0d0e10;
  --bg-1: #131418;
  --bg-2: #1a1c21;
  --term-bg: #0d0e10;
  --text-1: #e8e9ec;
  --text-2: #a7abb3;
  --text-3: #6f747d;
  --glass: rgba(255, 255, 255, 0.022);
  --glass-strong: rgba(255, 255, 255, 0.035);
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.14);
  --bg: #0d0e10;
  --panel: #131418;
  --text: #e8e9ec;
  --text-muted: #a7abb3;
  --border: #25282e;
  --border-subtle: #191b20;
  --row-hover: #1c1f25;
  --surface-2: #1a1c21;
  --surface-3: #08090b;
  --accent: #ffb000;
  --on-accent: #120c00;
  --brand: #ffb000;
  --brand-soft: #ffd47a;
  --badge-bg: #2a2310;
  --badge-fg: #ffd47a;
  --syn-keyword: #c4a7ff;
  --syn-string: #d9c7a0;
  --syn-number: #f2a8c4;
  --syn-comment: #8b9099;
  --syn-function: #e8e9ec;
  --syn-type: #8fd3c7;
  --syn-property: #b9bec7;
  --syn-punct: #a7abb3;
  /* Engine accents (#853 P4). A manifest names one of these by TOKEN (`display.accent`), never
     a hex, so an agent can only ever take a colour the design system has. Distinct from the
     status hues and the brand accent; slate is the neutral for a shell or an unknown engine.
     Held to >=3:1 on the chip grounds by contrast.test.ts. */
  --engine-amber: #d98a5c;
  --engine-teal: #4fd1c5;
  --engine-green: #7ee787;
  --engine-blue: #7aa2ff;
  --engine-lime: #c5e15a;
  --engine-magenta: #f472b6;
  --engine-slate: #8b98a5;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg-0: #e7e8ea;
  --bg-1: #f2f3f5;
  --bg-2: #ffffff;
  --term-bg: #f2f3f5;
  --text-1: #14161a;
  --text-2: #41454d;
  --text-3: #6f747d;
  --glass: rgba(10, 12, 16, 0.025);
  --glass-strong: rgba(10, 12, 16, 0.05);
  --line: rgba(10, 12, 16, 0.12);
  --line-strong: rgba(10, 12, 16, 0.2);
  --bg: #e7e8ea;
  --panel: #f2f3f5;
  --text: #14161a;
  --text-muted: #41454d;
  --border: #c9ccd2;
  --border-subtle: #d9dbe0;
  --row-hover: #e3e5e8;
  --surface-2: #ffffff;
  --surface-3: #dfe1e4;
  --accent: #ffb000;
  --on-accent: #120c00;
  --brand: #8a5a00; /* darker amber for the wordmark on light — readable */
  --brand-soft: #5e3d00;
  --badge-bg: #efe3c8;
  --badge-fg: #6b4e00;
  /* On the light ground the raw status hues are unreadable as small text — `--status-degraded`
     (#f59e0b) on #f2f3f5 measures ≈2.15:1, well under AA. Darkened toward --text-1 by color-mix
     rather than replaced with an invented hex, so a future palette change still carries through.
     The LED tokens are untouched: a 6px dot is not text and has its own (non-)requirement. */
  --git-add-fg: color-mix(in srgb, var(--status-up) 50%, var(--text-1));
  --git-mod-fg: color-mix(in srgb, var(--status-degraded) 45%, var(--text-1));
  --git-del-fg: var(--status-down);
  --danger-text: var(--status-down); /* 6.0:1 on --surface-2, 5.5:1 on --panel */
  --ok-text: color-mix(in srgb, var(--status-up) 45%, var(--text-1));
  --warn-text: color-mix(in srgb, var(--status-degraded) 40%, var(--text-1));
  --git-unknown-fg: color-mix(in srgb, var(--status-unknown) 80%, var(--text-1));
  --diff-add-fg: color-mix(in srgb, var(--status-up) 20%, var(--text-1));
  --diff-del-fg: color-mix(in srgb, var(--status-down) 20%, var(--text-1));
  --diff-add-bg: color-mix(in srgb, var(--status-up) 8%, transparent);
  --diff-del-bg: color-mix(in srgb, var(--status-down) 8%, transparent);
  /* Darker syntax set for the light ground (--surface-3 #dfe1e4); each ≥4.5:1 there. */
  --syn-keyword: #5b3fb0;
  --syn-string: #7a4e12;
  --syn-number: #a3306b;
  --syn-comment: #555a63;
  --syn-function: #14161a;
  --syn-type: #1d6b61;
  --syn-property: #41454d;
  --syn-punct: #41454d;
  /* Engine accents (#853 P4) — darker on the light ground, same names. */
  --engine-amber: #a8591f;
  --engine-teal: #0f7c73;
  --engine-green: #1f7a33;
  --engine-blue: #2f5fd0;
  --engine-lime: #5f7a00;
  --engine-magenta: #b3246f;
  --engine-slate: #5b6672;
}

</style>
<style>
* { box-sizing: border-box; border-radius: 0; }
body { margin: 0; color: var(--text-1); background: var(--bg-0); }
button, select { font: inherit; }
button, a, summary, select { -webkit-tap-highlight-color: transparent; }
button, select { color: var(--text-1); cursor: pointer; }
button:focus-visible, a:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--brand); text-decoration: none; }
button { min-height: 44px; border: 1px solid var(--line-strong); padding: 0 14px; background: transparent; }
button:hover, summary:hover { background: var(--glass-strong); }
.mono { font-family: var(--font-mono); }
.comparison { padding: 22px 24px; }
.review-title { font: 700 19px var(--font-mono); margin: 0 0 7px; }
.review-note { color: var(--text-2); font-size: 13px; margin: 0 0 20px; }
.review-controls { display: flex; gap: 8px; margin-bottom: 22px; }
.comparison-grid { display: grid; grid-template-columns: repeat(2, max-content); gap: 24px; align-items: start; }
.comparison-label { display: block; margin: 0 0 10px; color: var(--text-1); font: 700 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
.comparison-label small { font: 12px system-ui; color: var(--text-2); text-transform: none; letter-spacing: 0; display: block; margin-top: 5px; }
iframe { display: block; border: 1px solid var(--line-strong); width: 1180px; height: 880px; background: var(--bg-0); }
.comparison.mobile iframe { width: 390px; height: 844px; }
.full-scroll.app { height: auto; min-height: 100vh; grid-template-rows: 52px auto 28px; }
.full-scroll .scroll { height: auto; overflow: visible; }
.app { height: 100vh; display: grid; grid-template-rows: 52px minmax(0,1fr) 28px; }
.topbar { display: flex; align-items: center; gap: 16px; padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--bg-1); }
.brand { font: 700 16px var(--font-mono); letter-spacing: .2em; white-space: nowrap; color: var(--brand-soft); }
.brand .mark { color: var(--accent); margin-right: 10px; }
.brand b { color: var(--brand); }
.nav { display: flex; align-items: center; gap: 6px; }
.nav a { display: inline-flex; align-items: center; min-height: 44px; border: 1px solid var(--line-strong); padding: 0 12px; gap: 8px; color: var(--text-2); font: 10px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; }
.nav a.active { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.nav svg, .top-actions svg, button svg { width: 16px; height: 16px; flex: none; }
.top-actions { margin-left: auto; display: flex; gap: 14px; color: var(--text-2); align-items: center; }
.operator { height: 32px; min-width: 66px; border: 1px solid var(--line-strong); padding: 8px; font: 10px var(--font-mono); }
.pane { margin: 12px 12px 12px 6px; border: 1px solid var(--line); position: relative; min-height: 0; }
.pane:before,.pane:after { content: ''; pointer-events: none; width: 18px; height: 18px; border-color: var(--text-1); border-style: solid; position: absolute; z-index: 2; }
.pane:before { inset: -1px auto auto -1px; border-width: 1px 0 0 1px; }
.pane:after { inset: auto -1px -1px auto; border-width: 0 1px 1px 0; }
.scroll { overflow: auto; height: 100%; padding: 28px 14px 12px; }
.dashboard { max-width: 1320px; margin: 0 auto; }
.kicker { font: 10px var(--font-mono); letter-spacing: .08em; color: var(--text-3); text-transform: uppercase; }
.heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; }
h1 { margin: 8px 0 6px; font-size: 16px; letter-spacing: .06em; color: var(--accent); text-transform: uppercase; }
.actions { display: flex; gap: 8px; }
.actions button { display: inline-flex; align-items: center; gap: 7px; color: var(--text-2); font-size: 12px; }

.cols { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); align-items: start; gap: 14px; }
.cols > *, .row-body { min-width: 0; }

.row-controls { display: flex; gap: 6px; }
.row-controls button { font: 10px var(--font-mono); text-transform: uppercase; letter-spacing: .1em; }

.list-row .led { margin: 0; }
.right { font-size: 9px; white-space: nowrap; }

table { width: 100%; table-layout: fixed; border-collapse: collapse; }
th,td { padding: 8px 14px; border-bottom: 1px solid var(--line); text-align: left; }
th { color: var(--text-3); font: 9px var(--font-mono); text-transform: uppercase; }

.badge { border: 1px solid var(--line-strong); padding: 2px 5px; font: 8px var(--font-mono); white-space: nowrap; text-transform: uppercase; }

.optional { padding: 14px 14px 0; }
.state-note { margin: 0; padding: 14px; font-size: 12px; color: var(--text-2); line-height: 1.5; }
.state-error { display: flex; justify-content: space-between; align-items: center; gap: 14px; color: var(--danger-text); }
.state-error button { font: 10px var(--font-mono); color: var(--text-1); }
.history { display: flex; justify-content: flex-end; margin-bottom: 12px; }
.history a { display: inline-flex; align-items: center; min-height: 44px; font: 10px var(--font-mono); }
.footer { padding: 7px 18px; border-top: 1px solid var(--line); background: var(--bg-1); font: 10px var(--font-mono); color: var(--text-2); text-transform: uppercase; letter-spacing: .1em; }
@media (max-width: 800px) {
 .topbar { gap: 12px; padding: 0 10px; }
 .brand .wordmark { display: none; }
 .brand .mark { margin: 0; }
 .nav { gap: 3px; }
 .nav a { padding: 0 8px; }
 .nav a span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
 .top-actions { gap: 12px; }
 .operator { min-width: 30px; padding: 8px 6px; color: var(--brand); }
 .operator .local { display: none; }
 .pane { margin: 10px 8px 8px; }
 .scroll { padding: 26px 8px 12px; }
 .heading { margin-bottom: 2px; }
 h1 { font-size: 16px; }
 .actions { margin-top: 8px; }
 .sub { margin-top: 0; }
 .kpis { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
 .kpi { display: block; text-align: left; width: 100%; min-height: 84px; padding: 9px 10px; }
 .kpi-value { font-size: 19px; }
 .cols { grid-template-columns: 1fr; }
 .section-head { padding: 10px 14px; gap: 10px; }
 .section-head .meta { line-height: 1.6; }
 .needs-row { grid-template-columns: 10px minmax(0,1fr); }
 .row-controls { grid-column: 2; }
 .needs-row { padding: 12px 14px; }
 .row-title { font-size: 12px; }
 .list-row .row-meta { line-height: 1.5; }
 .optional { padding: 12px 10px 0; }
 .disclosure summary { font-size: 10px; gap: 10px; }
 .history { justify-content: flex-start; }
 .wide { display: none; }
}
</style>
<body>
<div id="root"></div>
<script>
const params = new URLSearchParams(location.search);
const theme = params.get('theme') === 'light' ? 'light' : 'dark';
document.documentElement.dataset.theme = theme;
const view = params.get('view') === 'mobile' ? 'mobile' : 'desktop';
const mode = params.get('mode');
const secondaryState = params.get('state') || 'populated';
const icon = (name) => {
 const paths = {
  dashboard: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="4"/><rect x="14" y="11" width="7" height="10"/><rect x="3" y="14" width="7" height="7"/>',
  terminal: '<rect x="3" y="4" width="18" height="16"/><path d="m7 8 4 4-4 4m7 0h3"/>',
  mission: '<circle cx="12" cy="12" r="9"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/>',
  library: '<path d="M4 3v18m4-16v14m4-16v18m4-16 4 14"/>',
  ask: '<path d="M21 15a2 2 0 0 1-2 2H7l-5 4V5a2 2 0 0 1 2-2h15a2 2 0 0 1 2 2z"/>',
  bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
 };
 return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">${paths[name] || paths.dashboard}</svg>`;
};
const section = (title, content, meta = '', extra = '') => `<section class="section" id="section-${title.toLowerCase().split(' · ')[0].replaceAll(' ','-')}"><header class="section-head"><span class="square"></span><h2>${title}</h2>${meta ? `<span class="meta">${meta}</span>` : ''}${extra}</header>${content}</section>`;
const needs = () => section('Needs you · 1', `<div class="needs-row"><span class="led" aria-label="Needs you"></span><div class="row-body"><a class="row-title" href="#">Review the deployment plan</a><div class="row-meta">claude · Alpha · 2 min ago</div><div class="why"><span class="kind">Decision</span>Ready to apply the deployment plan.</div></div><div class="row-controls"><button class="primary">Approve plan</button><button class="info" aria-label="Details">ⓘ</button></div></div>`, 'sessions without a mission · newest first', '<div class="filters"><select aria-label="Agent"><option>Agent · all</option></select><select aria-label="Project"><option>Project · all</option></select></div>');
const listRow = (title, meta, status = 'up', ago = '1 min ago') => `<div class="list-row"><span class="led ${status}"></span><div class="row-body"><a href="#" class="row-title">${title}</a><div class="row-meta">${meta}</div></div><span class="right">${ago}</span></div>`;
const running = () => section('Running sessions · 7', listRow('session a', 'claude · Alpha · working · running the e2e suite') + listRow('session b', 'codex · Alpha · live, idle · running the e2e suite', 'idle') + '<footer class="foot"><span>showing 2 of 7</span><a href="#">All 7 running →</a></footer>', 'live agent · 3 working');
const recent = () => section('Recent work', '<div class="timeline"><div class="day">Today</div><div class="event"><time>10:42</time><div><b>Alpha</b> — finished the test coverage update.</div></div><div class="event"><time>09:18</time><div><b>Beta</b> — reviewed the deployment plan.</div></div></div>', 'listed from your sessions', '<div class="seg"><button>1 DAY</button><button>2</button><button>3</button></div>');
const missions = () => section('Missions · 3', listRow('mission m3', 'in review · waiting on you · 1 session', '', '2 min ago') + listRow('mission m1', 'running · 1 session', 'up', '2 min ago') + listRow('mission m2', 'dispatching · 1 session', 'up', '2 min ago') + '<footer class="foot"><span>2 active · 1 in review</span><a href="#">All missions →</a></footer>', '2 active · 1 in review');
const quota = () => section('Quota', '<div class="quota"><div class="quota-head"><b>Claude</b><span>82% used · weekly</span></div><div class="bar"><i style="width:82%"></i></div><small>resets tomorrow · checked 6 min ago</small><small class="warn">runs out in ~9h at this pace · 15h before the reset</small></div><div class="quota"><div class="quota-head"><b>OpenCode</b><span>99% used · tokens</span></div><div class="bar"><i style="width:99%"></i></div><small>1.1M tokens · checked 5 min ago</small><small>on pace to stay under the limit</small></div>');
const mostRecent = () => section('Most recent sessions', '<table><thead><tr><th>Session</th><th>State</th><th class="wide">Agent · Project</th><th>Last activity</th></tr></thead><tbody><tr><td>Newest session</td><td><span class="badge working">In flight</span></td><td class="wide">claude · Alpha</td><td>just now</td></tr><tr><td>Older session</td><td><span class="badge waiting">Needs you</span></td><td class="wide">codex · Beta</td><td>1h ago</td></tr></tbody></table><footer class="foot"><span>by last activity</span><a href="#">All sessions →</a></footer>', 'by last activity · newest first');
const kpis = () => `<div class="kpis">${[
 ['Active agents','7','live · 3 working','claude 5/2　codex 2/1'],
 ['Missions','3','2 active · 1 in review',''],
 ['Needs you','1','session',''],
 ['Plan quota — lowest left','18%','claude · weekly','resets tomorrow · checked 6 min ago'],
].map(([label,value,context,sub], index) => `<button class="kpi" data-target="${['running-sessions','missions','needs-you','quota'][index]}"><div class="kpi-label"><span class="square"></span>${label}</div><div class="kpi-value">${value} <small>${context}</small></div>${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</button>`).join('')}</div>`;
function secondaryContent() {
 if (secondaryState === 'loading') return [
  ['Recent work','Reading recent work…'],
 ].map(([title,message]) => section(title, `<p class="state-note" role="status">${message}</p>`)).join('');
 if (secondaryState === 'error') return [
  ['Recent work','Couldn’t read recent work.'],
 ].map(([title,message]) => section(title, `<div class="state-note state-error" role="alert"><span>${message}</span></div>`)).join('');
 if (secondaryState === 'empty') return [
  ['Recent work','Nothing in this window yet.'],
 ].map(([title,message]) => section(title, `<p class="state-note">${message}</p>`)).join('');
 return recent();
}
function renderApp(after) {
 const content = after
  ? `${kpis()}<div class="cols"><div>${needs()}<details class="disclosure" id="optional"><summary>Recent work</summary><div class="optional" id="optional-content"></div></details><div class="history"><a href="#">All sessions →</a></div></div><div>${running()}${missions()}${quota()}</div></div>`
  : `${kpis()}<div class="cols"><div>${needs()}${recent()}${mostRecent()}</div><div>${running()}${missions()}${quota()}</div></div>`;
 document.getElementById('root').innerHTML = `<div class="app ${params.get('full-scroll') === '1' ? 'full-scroll' : ''}"><header class="topbar"><span class="brand"><span class="mark">◢</span><span class="wordmark">BATTLE<b>LAB</b></span></span><nav class="nav" aria-label="Main sections">${[['dashboard','Dashboard'],['terminal','Sessions'],['mission','Missions'],['library','Library']].map(([ico,label],i) => `<a href="#" class="${i === 0 ? 'active' : ''}">${icon(ico)}<span>${label}</span></a>`).join('')}</nav><span class="top-actions">${icon('ask')}${icon('bell')}<span class="operator">··<span class="local"> LOCAL</span></span></span></header><main class="pane"><div class="scroll"><div class="dashboard"><div class="kicker">Dashboard // what is going on</div><div class="heading"><h1>BattleLab dashboard</h1><div class="actions"><button>${icon('ask')}Ask</button><button>${icon('plus')}New⌄</button></div></div><p class="sub">${after ? 'What is running, what needs you and what you did.' : 'What is running, what needs you and what you did.'}</p>${content}</div></div></main><footer class="footer">BattleLab</footer></div>`;
 if (after) {
  const disclosure = document.getElementById('optional');
  disclosure.addEventListener('toggle', () => {
   document.getElementById('optional-content').innerHTML = disclosure.open ? secondaryContent() : '';
  });
  document.querySelectorAll('.kpi').forEach(button => {
   button.addEventListener('click', () => {
    requestAnimationFrame(() => document.getElementById('section-' + button.dataset.target)?.scrollIntoView({block:'start'}));
   });
  });
  if (params.get('expanded') === '1') {
   disclosure.open = true;
   if (params.get('focus') === 'secondary') requestAnimationFrame(() => disclosure.scrollIntoView({block:'start'}));
  }
 }
}
if (mode === 'before' || mode === 'after') {
 renderApp(mode === 'after');
} else {
 document.getElementById('root').innerHTML = `<main class="comparison ${view}"><h1 class="review-title">Dashboard / focus on the next action</h1><p class="review-note">Pre-implementation prototype · identical fixture data · ${view === 'mobile' ? '390 × 844' : '1180 × 880'} viewport · ${theme} theme</p><div class="review-controls"><button id="theme">Toggle theme</button><button id="view">Desktop / mobile</button></div><div class="comparison-grid"><article><span class="comparison-label">Before<small>4 metric cards + 6 sections compete for attention</small></span><iframe title="Before dashboard simplification" src="?mode=before&theme=${theme}&view=${view}"></iframe></article><article><span class="comparison-label">After<small>Overview cards, missions and quota retained · recent work on demand</small></span><iframe title="After dashboard simplification" src="?mode=after&theme=${theme}&view=${view}"></iframe></article></div></main>`;
 document.getElementById('theme').onclick = () => { params.set('theme', theme === 'dark' ? 'light' : 'dark'); location.search = params.toString(); };
 document.getElementById('view').onclick = () => { params.set('view', view === 'mobile' ? 'desktop' : 'mobile'); location.search = params.toString(); };
}
</script>
</body>
</html>
