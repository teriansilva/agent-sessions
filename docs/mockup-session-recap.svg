    Mockup for: session recap modal + Pulse work recap.
    - A recap icon (lucide ScrollText) sits in the session panel header, right of STATUS // LIVE.
      Pressing it opens a "SESSION BRIEF" modal: full title, meta, optional
      intervention chip, one-line SUMMARY (ai_summary), and a chronological RECAP (new ai_recap).
    - Pulse's single-line banner becomes a short chronological paragraph recapping recent work
      across all relevant sessions.
    Colours are the real web/src/index.css tokens. Dark + light + mobile.
  -->
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace; }
    </style>
