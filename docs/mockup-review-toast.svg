<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="920" viewBox="0 0 1480 920" font-family="'JetBrains Mono','Cascadia Mono',ui-monospace,monospace">
  <!-- ======= canvas ======= -->
  <rect width="1480" height="920" fill="#08090b"/>
  <text x="40" y="44" fill="#a7abb3" font-size="15">// #392 — Review-now outcome toast · sidebar foot · HUD tokens (web/src/index.css)</text>

  <!-- ============================================================ -->
  <!-- Panel 1: desktop dark — SUCCESS toast                        -->
  <!-- ============================================================ -->
  <text x="40" y="86" fill="#e8e9ec" font-size="14">[ desktop · dark · success — auto-dismiss 6s ]</text>
  <g transform="translate(40,100)">
    <!-- sidebar frame -->
    <rect width="360" height="560" fill="#131418" stroke="#25282e"/>
    <!-- corner brackets -->
    <path d="M0,10 V0 H10 M350,0 H360 V10 M360,550 V560 H350 M10,560 H0 V550" fill="none" stroke="#ffb000" stroke-width="2"/>
    <!-- new session CTA -->
    <rect x="8" y="10" width="344" height="34" fill="#ffb000"/>
    <text x="180" y="32" fill="#120c00" font-size="13" font-weight="600" text-anchor="middle">+ New session</text>
    <!-- filter bar hint -->
    <rect x="8" y="52" width="344" height="26" fill="#1a1c21" stroke="#25282e"/>
    <text x="16" y="69" fill="#6f747d" font-size="11">// filter sessions…</text>
    <!-- rows -->
    <g transform="translate(0,88)">
      <rect x="0" y="0" width="360" height="58" fill="#1c1f25"/>
      <text x="14" y="20" fill="#e8e9ec" font-size="13">Refit the pipeline</text>
      <text x="14" y="38" fill="#3fbf6f" font-size="11">Pipeline refit; tests green; awaiting deploy</text>
      <text x="14" y="52" fill="#6f747d" font-size="10">claude · ~/code/pipeline · 2m ago</text>
      <text x="338" y="24" fill="#a7abb3" font-size="14">⋯</text>
    </g>
    <g transform="translate(0,148)">
      <rect x="0" y="0" width="360" height="58" fill="#131418"/>
      <text x="14" y="20" fill="#e8e9ec" font-size="13">ws reconnect bug</text>
      <text x="14" y="38" fill="#a7abb3" font-size="11">Investigating delta-resume backoff</text>
      <text x="14" y="52" fill="#6f747d" font-size="10">opencode · ~/code/agent-sessions · 1h ago</text>
    </g>
    <g transform="translate(0,208)">
      <rect x="0" y="0" width="360" height="58" fill="#131418"/>
      <text x="14" y="20" fill="#e8e9ec" font-size="13">landing page copy</text>
      <text x="14" y="38" fill="#a7abb3" font-size="11">Hero copy shipped; SEO pass pending</text>
      <text x="14" y="52" fill="#6f747d" font-size="10">claude · ~/code/landing · 3h ago</text>
    </g>
    <!-- spacer suggestion -->
    <text x="180" y="330" fill="#25282e" font-size="11" text-anchor="middle">· · ·</text>
    <!-- SUCCESS TOAST pinned at sidebar foot (flex sibling — never overlays rows) -->
    <g transform="translate(8,484)">
      <rect width="344" height="64" fill="#1a1c21" stroke="#25282e"/>
      <rect width="3" height="64" fill="#3fbf6f"/>
      <rect x="12" y="12" width="8" height="8" fill="#3fbf6f"/>
      <text x="30" y="20" fill="#e8e9ec" font-size="11.5">
        <tspan x="30" dy="6">Pipeline refit complete; all tests green;</tspan>
        <tspan x="30" dy="16">deploy verified live on staging</tspan>
      </text>
      <text x="326" y="20" fill="#a7abb3" font-size="12">✕</text>
      <text x="30" y="56" fill="#6f747d" font-size="9.5">role="status" aria-live="polite" · auto-dismiss 6s</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- Panel 2: desktop dark — ERROR toast                          -->
  <!-- ============================================================ -->
  <text x="460" y="86" fill="#e8e9ec" font-size="14">[ desktop · dark · failure — lingers 12s ]</text>
  <g transform="translate(460,100)">
    <rect width="360" height="560" fill="#131418" stroke="#25282e"/>
    <path d="M0,10 V0 H10 M350,0 H360 V10 M360,550 V560 H350 M10,560 H0 V550" fill="none" stroke="#ffb000" stroke-width="2"/>
    <rect x="8" y="10" width="344" height="34" fill="#ffb000"/>
    <text x="180" y="32" fill="#120c00" font-size="13" font-weight="600" text-anchor="middle">+ New session</text>
    <rect x="8" y="52" width="344" height="26" fill="#1a1c21" stroke="#25282e"/>
    <text x="16" y="69" fill="#6f747d" font-size="11">// filter sessions…</text>
    <g transform="translate(0,88)">
      <rect x="0" y="0" width="360" height="58" fill="#1c1f25"/>
      <text x="14" y="20" fill="#e8e9ec" font-size="13">rotate creds</text>
      <!-- last good summary NEVER overwritten on failure -->
      <text x="14" y="38" fill="#a7abb3" font-size="11">Last good summary · reviewed 2h ago</text>
      <text x="14" y="52" fill="#6f747d" font-size="10">claude · ~/infra · 5m ago</text>
      <!-- spinner stopped -->
      <text x="338" y="24" fill="#a7abb3" font-size="14">⋯</text>
    </g>
    <g transform="translate(0,148)">
      <rect x="0" y="0" width="360" height="58" fill="#131418"/>
      <text x="14" y="20" fill="#e8e9ec" font-size="13">ws reconnect bug</text>
      <text x="14" y="38" fill="#a7abb3" font-size="11">Investigating delta-resume backoff</text>
      <text x="14" y="52" fill="#6f747d" font-size="10">opencode · ~/code/agent-sessions · 1h ago</text>
    </g>
    <text x="180" y="330" fill="#25282e" font-size="11" text-anchor="middle">· · ·</text>
    <!-- ERROR TOAST -->
    <g transform="translate(8,484)">
      <rect width="344" height="64" fill="#1a1c21" stroke="#25282e"/>
      <rect width="3" height="64" fill="#c02020"/>
      <rect x="12" y="12" width="8" height="8" fill="#c02020"/>
      <text x="30" y="20" fill="#e8e9ec" font-size="11.5">
        <tspan x="30" dy="6">Review failed — review endpoint timed out</tspan>
        <tspan x="30" dy="16">after 120s</tspan>
      </text>
      <text x="326" y="20" fill="#a7abb3" font-size="12">✕</text>
      <text x="30" y="56" fill="#6f747d" font-size="9.5">server `detail` verbatim (sanitized) · lingers 12s · ✕ to dismiss</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- Panel 3: mobile dark — toast above the bottom edge           -->
  <!-- ============================================================ -->
  <text x="880" y="86" fill="#e8e9ec" font-size="14">[ mobile · dark — in-flow at the foot,</text>
  <text x="880" y="104" fill="#e8e9ec" font-size="14">  never overlays rows or system bars ]</text>
  <g transform="translate(880,120)">
    <rect width="270" height="540" fill="#131418" stroke="#25282e"/>
    <path d="M0,10 V0 H10 M260,0 H270 V10 M270,530 V540 H260 M10,540 H0 V530" fill="none" stroke="#ffb000" stroke-width="2"/>
    <rect x="6" y="8" width="258" height="30" fill="#ffb000"/>
    <text x="135" y="28" fill="#120c00" font-size="12" font-weight="600" text-anchor="middle">+ New session</text>
    <g transform="translate(0,46)">
      <rect x="0" y="0" width="270" height="52" fill="#1c1f25"/>
      <text x="12" y="18" fill="#e8e9ec" font-size="12">Refit the pipeline</text>
      <text x="12" y="34" fill="#3fbf6f" font-size="10">Pipeline refit; tests green</text>
      <text x="12" y="46" fill="#6f747d" font-size="9">claude · 2m ago</text>
    </g>
    <g transform="translate(0,100)">
      <rect x="0" y="0" width="270" height="52" fill="#131418"/>
      <text x="12" y="18" fill="#e8e9ec" font-size="12">ws reconnect bug</text>
      <text x="12" y="34" fill="#a7abb3" font-size="10">Investigating delta-resume backoff</text>
      <text x="12" y="46" fill="#6f747d" font-size="9">opencode · 1h ago</text>
    </g>
    <text x="135" y="300" fill="#25282e" font-size="11" text-anchor="middle">· · ·</text>
    <!-- toast: long text WRAPS, no horizontal scroll -->
    <g transform="translate(6,452)">
      <rect width="258" height="80" fill="#1a1c21" stroke="#25282e"/>
      <rect width="3" height="80" fill="#3fbf6f"/>
      <rect x="10" y="12" width="8" height="8" fill="#3fbf6f"/>
      <text x="26" y="19" fill="#e8e9ec" font-size="10.5">
        <tspan x="26" dy="0">Pipeline refit complete; all</tspan>
        <tspan x="26" dy="14">tests green; deploy verified</tspan>
        <tspan x="26" dy="14">live — clamped to 4 lines</tspan>
      </text>
      <text x="242" y="19" fill="#a7abb3" font-size="11">✕</text>
      <text x="26" y="72" fill="#6f747d" font-size="8.5">wraps, clamps — never overflows horizontally</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- Panel 4: light theme — same anatomy, light tokens            -->
  <!-- ============================================================ -->
  <text x="1210" y="104" fill="#e8e9ec" font-size="14">[ light · failure ]</text>
  <g transform="translate(1195,120)">
    <rect width="240" height="290" fill="#f4f4f2" stroke="#d8d8d4"/>
    <path d="M0,10 V0 H10 M230,0 H240 V10 M240,280 V290 H230 M10,290 H0 V280" fill="none" stroke="#b87700" stroke-width="2"/>
    <g transform="translate(0,14)">
      <rect x="0" y="0" width="240" height="48" fill="#e9e9e5"/>
      <text x="12" y="18" fill="#1c1d20" font-size="11">rotate creds</text>
      <text x="12" y="33" fill="#5d626b" font-size="9.5">Last good summary · reviewed 2h ago</text>
    </g>
    <!-- light error toast -->
    <g transform="translate(6,200)">
      <rect width="228" height="70" fill="#ffffff" stroke="#d8d8d4"/>
      <rect width="3" height="70" fill="#c02020"/>
      <rect x="10" y="12" width="8" height="8" fill="#c02020"/>
      <text x="26" y="19" fill="#1c1d20" font-size="10">
        <tspan x="26" dy="0">Review failed — endpoint</tspan>
        <tspan x="26" dy="13">returned HTTP 401</tspan>
      </text>
      <text x="212" y="19" fill="#5d626b" font-size="11">✕</text>
      <text x="26" y="62" fill="#8a8f98" font-size="8.5">AA on light surfaces</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- Annotations                                                   -->
  <!-- ============================================================ -->
  <g transform="translate(40,700)">
    <rect width="1395" height="180" fill="#131418" stroke="#25282e"/>
    <path d="M0,10 V0 H10 M1385,0 H1395 V10 M1395,170 V180 H1385 M10,180 H0 V170" fill="none" stroke="#ffb000" stroke-width="2"/>
    <text x="20" y="30" fill="#ffb000" font-size="13">// anatomy + behaviour</text>
    <text x="20" y="58" fill="#e8e9ec" font-size="12">· placement — a flex sibling at the sidebar FOOT (below the scrolling list): in-flow, never overlays rows / the row menu / the mobile bottom edge; always-mounted polite live region.</text>
    <text x="20" y="84" fill="#e8e9ec" font-size="12">· success — status-up (#3fbf6f) LED + 3px left rule; body is the FRESH one-line ai_summary (the row updates in place at the same moment); auto-dismisses after 6s or on ✕.</text>
    <text x="20" y="110" fill="#e8e9ec" font-size="12">· failure — status-down (#c02020) LED; body = "Review failed — " + server `detail` (gateway timeout, endpoint HTTP status; never keys/headers); lingers 12s; last good summary kept.</text>
    <text x="20" y="136" fill="#e8e9ec" font-size="12">· HUD grammar — flat fills, square corners, mono chrome, status colors used ONLY for status; amber stays on the frame/CTA; text clamps to 4 lines and wraps — no horizontal scroll at 390px.</text>
    <text x="20" y="162" fill="#6f747d" font-size="11">// tokens: --surface-2 #1a1c21 · --border #25282e · --status-up #3fbf6f · --status-down #c02020 · --text #e8e9ec · --text-muted #a7abb3 · --accent #ffb000</text>
  </g>
</svg>
