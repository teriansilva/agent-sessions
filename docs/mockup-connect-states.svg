    <rect x="24" y="196" width="320" height="40" fill="#ffb000"/>
    <text x="184" y="221" fill="#120c00" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">USE LOOPBACK BIND</text>
    <text x="24" y="262" fill="#6f747d" font-size="10">Home Free now streams the full app only;</text>
    <text x="24" y="278" fill="#6f747d" font-size="10">no terminal fallback is exposed.</text>
  </g>

  <!-- ============================================================= -->
  <!-- ROW 3 — MOBILE reflow (dark) — ≤800px single column            -->
  <!-- ============================================================= -->
  <text x="32" y="820" fill="#6f747d" font-size="10" letter-spacing="2">MOBILE // DARK (≤800px reflow — near-opaque chrome, stacked)</text>

  <g transform="translate(32,832)">
    <rect width="300" height="352" fill="#131418" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
    <use href="#cnr-tl" x="0" y="0"/><use href="#cnr-tr" x="300" y="0"/>
    <use href="#cnr-bl" x="0" y="352"/><use href="#cnr-br" x="300" y="352"/>
    <text x="16" y="28" fill="#ffb000" font-size="12" font-weight="700" letter-spacing="2">◢ BATTLELAB</text>
    <line x1="0" y1="42" x2="300" y2="42" stroke="rgba(255,255,255,.08)"/>
    <circle cx="20" cy="64" r="4" fill="#ffb000"/>
    <text x="34" y="68" fill="#e8e9ec" font-size="12">CONNECTING</text>
    <text x="20" y="98" fill="#3fbf6f" font-size="12">✓ human verification</text>
    <text x="20" y="122" fill="#3fbf6f" font-size="12">✓ encrypted channel</text>
    <text x="20" y="146" fill="#ffb000" font-size="12">⟳ loading app shell…</text>
    <rect x="20" y="166" width="260" height="4" fill="#1a1c21"/>
    <rect x="20" y="166" width="150" height="4" fill="#ffb000"/>
    <!-- stacked inputs (form reflow) -->
    <rect x="20" y="192" width="260" height="34" fill="#0d0e10" stroke="#25282e"/>
    <text x="30" y="214" fill="#6f747d" font-size="11">console name</text>
    <rect x="20" y="232" width="260" height="34" fill="#0d0e10" stroke="#25282e"/>
    <text x="30" y="254" fill="#6f747d" font-size="11">access key</text>
    <rect x="20" y="276" width="260" height="42" fill="#ffb000"/>
    <text x="150" y="302" fill="#120c00" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">CONNECT</text>
    <text x="20" y="340" fill="#6f747d" font-size="9">🔒 blind relay · zero-knowledge · TTL 59:12</text>
  </g>

  <!-- annotations beside the mobile card -->
  <g transform="translate(360,860)" fill="#a7abb3" font-size="12">
    <text x="0" y="0" fill="#ffb000" font-size="11" letter-spacing="1">NOTES</text>
    <text x="0" y="26">• States are the ONLY new UI — once paired, the streamed surface</text>
    <text x="0" y="44">  is the existing BattleLab app (sidebar / Pulse / terminals), unchanged.</text>
    <text x="0" y="70">• Tokens: --accent #ffb000 (brand) kept separate from status hues;</text>
    <text x="0" y="88">  red (#c02020) reserved for active failure; amber-status (#f59e0b)</text>
    <text x="0" y="106">  for refusal / setup-required states — never the brand accent.</text>
    <text x="0" y="132">• No rounded corners; 2px amber corner-bracket frames + 1px hairline.</text>
    <text x="0" y="150">• LEDs paired with text (never colour-only); mono uppercase // chrome.</text>
    <text x="0" y="176">• Mobile ≤800px: single column, stacked inputs, ≥44px touch targets,</text>
    <text x="0" y="194">  near-opaque chrome (mobile Chrome drops backdrop-filter).</text>
    <text x="0" y="220" fill="#6f747d">Rendered to docs/design.md HUD tokens · light + dark · desktop + mobile.</text>
  </g>
</svg>
