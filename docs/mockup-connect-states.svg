    <text x="38" y="74" fill="#e8e9ec" font-size="12" letter-spacing="1">STREAM MODE REFUSED</text>
    <text x="24" y="104" fill="#a7abb3" font-size="12">This install is not loopback-bound,</text>
    <text x="24" y="122" fill="#a7abb3" font-size="12">or the app-mode handshake failed.</text>
    <text x="24" y="146" fill="#a7abb3" font-size="12">Re-run with 127.0.0.1 or use</text>
    <text x="24" y="164" fill="#a7abb3" font-size="12">ordinary self-host mode.</text>
    <rect x="24" y="196" width="320" height="40" fill="#ffb000"/>
    <text x="184" y="221" fill="#120c00" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">USE LOOPBACK BIND</text>
    <text x="24" y="262" fill="#6f747d" font-size="10">Home Free now streams the full app only;</text>
    <text x="24" y="278" fill="#6f747d" font-size="10">no terminal fallback is exposed.</text>
  </g>

