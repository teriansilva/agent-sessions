<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1220" viewBox="0 0 1240 1220" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">
  <defs>
    <!-- corner-bracket: 2px amber L, drawn as a group referenced at each corner -->
    <g id="cnr-tl"><path d="M0 14 V0 H14" fill="none" stroke="#ffb000" stroke-width="2"/></g>
    <g id="cnr-tr"><path d="M-14 0 H0 V14" fill="none" stroke="#ffb000" stroke-width="2"/></g>
    <g id="cnr-bl"><path d="M0 -14 V0 H14" fill="none" stroke="#ffb000" stroke-width="2"/></g>
    <g id="cnr-br"><path d="M-14 0 H0 V-14" fill="none" stroke="#ffb000" stroke-width="2"/></g>
  </defs>

  <!-- page ground -->
  <rect width="1240" height="1220" fill="#08090b"/>

  <!-- ===== title band ===== -->
  <text x="32" y="34" fill="#ffb000" font-size="15" font-weight="700" letter-spacing="3">◢ BATTLELAB</text>
  <text x="176" y="34" fill="#a7abb3" font-size="12" letter-spacing="1.5">// REMOTE CONNECT — full-app states (P3 · #579)</text>
  <text x="32" y="56" fill="#6f747d" font-size="11" letter-spacing="1">LOADING // ERROR — app-only connect states; the streamed surface is the existing app</text>
  <line x1="32" y1="70" x2="1208" y2="70" stroke="rgba(255,255,255,.14)" stroke-width="1"/>

  <!-- ============================================================= -->
  <!-- ROW 1 — DARK / DESKTOP                                         -->
  <!-- ============================================================= -->
  <text x="32" y="100" fill="#6f747d" font-size="10" letter-spacing="2">DARK // DESKTOP</text>

  <!-- Card: Card A: LOADING (dark) -->
  <g transform="translate(32,112)">
    <rect width="368" height="300" fill="#131418" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
    <use href="#cnr-tl" x="0" y="0"/><use href="#cnr-tr" x="368" y="0"/>
    <use href="#cnr-bl" x="0" y="300"/><use href="#cnr-br" x="368" y="300"/>
    <text x="18" y="30" fill="#ffb000" font-size="12" font-weight="700" letter-spacing="2">◢ BATTLELAB</text>
    <text x="150" y="30" fill="#6f747d" font-size="9" letter-spacing="1.5">REMOTE // CONNECT</text>
    <line x1="0" y1="46" x2="368" y2="46" stroke="rgba(255,255,255,.08)"/>
    <!-- state tag + LED -->
    <circle cx="24" cy="70" r="4" fill="#ffb000"/>
    <text x="38" y="74" fill="#e8e9ec" font-size="12" letter-spacing="1">CONNECTING // nightjar-box</text>
    <!-- handshake checklist -->
    <text x="24" y="108" fill="#3fbf6f" font-size="12">✓</text>
    <text x="44" y="108" fill="#a7abb3" font-size="12">human verification solved</text>
    <text x="24" y="134" fill="#3fbf6f" font-size="12">✓</text>
    <text x="44" y="134" fill="#a7abb3" font-size="12">end-to-end channel established</text>
    <text x="24" y="160" fill="#ffb000" font-size="12">⟳</text>
    <text x="44" y="160" fill="#e8e9ec" font-size="12">loading app shell…</text>
    <text x="24" y="186" fill="#6f747d" font-size="12">·</text>
    <text x="44" y="186" fill="#6f747d" font-size="12">streaming your sessions</text>
    <!-- progress rail -->
    <rect x="24" y="210" width="320" height="4" fill="#1a1c21"/>
    <rect x="24" y="210" width="205" height="4" fill="#ffb000"/>
    <!-- blind-relay reassurance -->
    <line x1="0" y1="244" x2="368" y2="244" stroke="rgba(255,255,255,.08)"/>
    <text x="24" y="268" fill="#6f747d" font-size="10">🔒 end-to-end encrypted · the relay is blind</text>
    <text x="24" y="286" fill="#6f747d" font-size="10">SEC // ZERO-KNOWLEDGE   ·   TTL // 59:12</text>
  </g>

  <!-- Card: Card B: ERROR (dark) -->
  <g transform="translate(436,112)">
    <rect width="368" height="300" fill="#131418" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
    <use href="#cnr-tl" x="0" y="0"/><use href="#cnr-tr" x="368" y="0"/>
    <use href="#cnr-bl" x="0" y="300"/><use href="#cnr-br" x="368" y="300"/>
    <text x="18" y="30" fill="#ffb000" font-size="12" font-weight="700" letter-spacing="2">◢ BATTLELAB</text>
    <text x="150" y="30" fill="#6f747d" font-size="9" letter-spacing="1.5">REMOTE // CONNECT</text>
    <line x1="0" y1="46" x2="368" y2="46" stroke="rgba(255,255,255,.08)"/>
