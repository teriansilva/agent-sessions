    <circle cx="24" cy="70" r="4" fill="#c02020"/>
    <text x="38" y="74" fill="#e5484d" font-size="12" letter-spacing="1">COULD NOT CONNECT</text>
    <text x="24" y="104" fill="#a7abb3" font-size="12">connection_failed —</text>
    <text x="24" y="122" fill="#a7abb3" font-size="12">the box isn't reachable through the</text>
    <text x="24" y="140" fill="#a7abb3" font-size="12">relay, or the access key is wrong.</text>
    <text x="24" y="176" fill="#6f747d" font-size="11">Check the console name + access key,</text>
    <text x="24" y="192" fill="#6f747d" font-size="11">then retry. Nothing was exposed.</text>
    <!-- CTA primary (amber) + ghost -->
    <rect x="24" y="216" width="150" height="38" fill="#ffb000"/>
    <text x="99" y="240" fill="#120c00" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">RETRY</text>
    <text x="186" y="238" fill="#6f747d" font-size="10">no shell fallback</text>
    <line x1="0" y1="272" x2="368" y2="272" stroke="rgba(255,255,255,.08)"/>
    <text x="24" y="290" fill="#6f747d" font-size="10">no retry on 4401/4404 — surfaced, not looped</text>
  </g>

  <!-- Card: Card C: REFUSED (dark) -->
  <g transform="translate(840,112)">
    <rect width="368" height="300" fill="#131418" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
    <use href="#cnr-tl" x="0" y="0"/><use href="#cnr-tr" x="368" y="0"/>
    <use href="#cnr-bl" x="0" y="300"/><use href="#cnr-br" x="368" y="300"/>
    <text x="18" y="30" fill="#ffb000" font-size="12" font-weight="700" letter-spacing="2">◢ BATTLELAB</text>
