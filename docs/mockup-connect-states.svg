    <use href="#cnr-tl" x="0" y="0"/><use href="#cnr-tr" x="368" y="0"/>
    <use href="#cnr-bl" x="0" y="300"/><use href="#cnr-br" x="368" y="300"/>
    <text x="18" y="30" fill="#b3760a" font-size="12" font-weight="700" letter-spacing="2">◢ BATTLELAB</text>
    <text x="150" y="30" fill="#6f747d" font-size="9" letter-spacing="1.5">REMOTE // CONNECT</text>
    <line x1="0" y1="46" x2="368" y2="46" stroke="rgba(10,12,16,.12)"/>
    <circle cx="24" cy="70" r="4" fill="#ffb000"/>
    <text x="38" y="74" fill="#14161a" font-size="12" letter-spacing="1">CONNECTING // nightjar-box</text>
    <text x="24" y="108" fill="#2f9e57" font-size="12">✓</text>
    <text x="44" y="108" fill="#41454d" font-size="12">human verification solved</text>
    <text x="24" y="134" fill="#2f9e57" font-size="12">✓</text>
    <text x="44" y="134" fill="#41454d" font-size="12">end-to-end channel established</text>
    <text x="24" y="160" fill="#b3760a" font-size="12">⟳</text>
    <text x="44" y="160" fill="#14161a" font-size="12">loading app shell…</text>
    <text x="24" y="186" fill="#6f747d" font-size="12">·</text>
    <text x="44" y="186" fill="#6f747d" font-size="12">streaming your sessions</text>
    <rect x="24" y="210" width="320" height="4" fill="#dfe1e4"/>
    <rect x="24" y="210" width="205" height="4" fill="#ffb000"/>
    <line x1="0" y1="244" x2="368" y2="244" stroke="rgba(10,12,16,.12)"/>
    <text x="24" y="268" fill="#6f747d" font-size="10">🔒 end-to-end encrypted · the relay is blind</text>
    <text x="24" y="286" fill="#6f747d" font-size="10">SEC // ZERO-KNOWLEDGE   ·   TTL // 59:12</text>
  </g>

  <!-- Card: Card B: ERROR (light) -->
  <g transform="translate(436,472)">
    <rect width="368" height="300" fill="#f2f3f5" stroke="rgba(10,12,16,.2)" stroke-width="1"/>
    <use href="#cnr-tl" x="0" y="0"/><use href="#cnr-tr" x="368" y="0"/>
    <use href="#cnr-bl" x="0" y="300"/><use href="#cnr-br" x="368" y="300"/>
    <text x="18" y="30" fill="#b3760a" font-size="12" font-weight="700" letter-spacing="2">◢ BATTLELAB</text>
    <text x="150" y="30" fill="#6f747d" font-size="9" letter-spacing="1.5">REMOTE // CONNECT</text>
    <line x1="0" y1="46" x2="368" y2="46" stroke="rgba(10,12,16,.12)"/>
    <circle cx="24" cy="70" r="4" fill="#c02020"/>
    <text x="38" y="74" fill="#c02020" font-size="12" letter-spacing="1">COULD NOT CONNECT</text>
    <text x="24" y="104" fill="#41454d" font-size="12">connection_failed —</text>
    <text x="24" y="122" fill="#41454d" font-size="12">the box isn't reachable through the</text>
    <text x="24" y="140" fill="#41454d" font-size="12">relay, or the access key is wrong.</text>
    <text x="24" y="176" fill="#6f747d" font-size="11">Check the console name + access key,</text>
    <text x="24" y="192" fill="#6f747d" font-size="11">then retry. Nothing was exposed.</text>
    <rect x="24" y="216" width="150" height="38" fill="#ffb000"/>
    <text x="99" y="240" fill="#120c00" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">RETRY</text>
    <text x="186" y="238" fill="#6f747d" font-size="10">no shell fallback</text>
    <line x1="0" y1="272" x2="368" y2="272" stroke="rgba(10,12,16,.12)"/>
    <text x="24" y="290" fill="#6f747d" font-size="10">no retry on 4401/4404 — surfaced, not looped</text>
  </g>

  <!-- Card: Card C: REFUSED (light) -->
  <g transform="translate(840,472)">
    <rect width="368" height="300" fill="#f2f3f5" stroke="rgba(10,12,16,.2)" stroke-width="1"/>
    <use href="#cnr-tl" x="0" y="0"/><use href="#cnr-tr" x="368" y="0"/>
    <use href="#cnr-bl" x="0" y="300"/><use href="#cnr-br" x="368" y="300"/>
    <text x="18" y="30" fill="#b3760a" font-size="12" font-weight="700" letter-spacing="2">◢ BATTLELAB</text>
    <text x="150" y="30" fill="#6f747d" font-size="9" letter-spacing="1.5">REMOTE // CONNECT</text>
    <line x1="0" y1="46" x2="368" y2="46" stroke="rgba(10,12,16,.12)"/>
    <circle cx="24" cy="70" r="4" fill="#f59e0b"/>
    <text x="38" y="74" fill="#14161a" font-size="12" letter-spacing="1">STREAM MODE REFUSED</text>
    <text x="24" y="104" fill="#41454d" font-size="12">This install is not loopback-bound,</text>
    <text x="24" y="122" fill="#41454d" font-size="12">or the app-mode handshake failed.</text>
    <text x="24" y="146" fill="#41454d" font-size="12">Re-run with 127.0.0.1 or use</text>
