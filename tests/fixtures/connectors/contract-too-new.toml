# refuse: needs a newer BattleLab
contract = 2

[identity]
id = "forgejo"
label = "Forgejo"
publisher = "battlelab"
version = "1"
category = "versioning"

[adapter]
kind = "forgejo-api"

[origin]
mode = "operator"

[auth]
kind = "token-header"
scheme = "token"
scopes = ["read:issue", "read:repository"]

[capabilities]
read = ["repos", "issues", "pulls", "ci", "files"]
