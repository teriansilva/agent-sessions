# refuse: capabilities.send 'message' is not one forgejo-api does
contract = 1

[identity]
id = "forgejo"
label = "Forgejo"
publisher = "battlelab"
version = "1"
category = "versioning"

[adapter]
kind = "forgejo-api"

[origin]
mode = "operator"

[auth]
kind = "token-header"
scheme = "token"
scopes = ["read:issue", "read:repository"]

[capabilities]
send = ["message"]
read = ["repos", "issues", "pulls", "ci", "files"]
