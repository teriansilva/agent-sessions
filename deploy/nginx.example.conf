# Example reverse-proxy vhost for agent-sessions (BattleLab).
#
# Copy this to your nginx sites dir, set `server_name` + your TLS cert paths,
# and point `proxy_pass` at the app's bind address (default 127.0.0.1:8765).
#
# Why a reverse proxy is REQUIRED: the app binds localhost and does not
# terminate TLS or rate-limit. agent-sessions is a single-admin tool that
# launches agents with permission bypass by design — it must sit behind
# TLS + auth and is NOT multi-tenant. See README.md "Security / trust model".

# Rate-limit the login endpoint to blunt credential stuffing.
limit_req_zone $binary_remote_addr zone=agent_sessions_login:10m rate=5r/m;

# Public share links (#1404): the token IS the path of /p/<token>, so the access line for that
# location drops the path. (The app masks it in its own logs the same way.)
log_format agent_sessions_share '$remote_addr - [$time_local] "$request_method /p/<redacted>" '
                                '$status $body_bytes_sent';

# WebSocket upgrade map (set $connection_upgrade to "upgrade" only for ws).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream agent_sessions {
    # Match AGENT_SESSIONS_HOST / AGENT_SESSIONS_PORT (default 127.0.0.1:8765).
    server 127.0.0.1:8765;
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.example;

    # TLS — point these at your certificate (e.g. from Let's Encrypt / certbot).
    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    # Reasonable defaults; tune to your policy.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Browser containment headers (#612 P1). The APP already sets the full set — CSP,
    # X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy, and HSTS
    # (keyed off the `X-Forwarded-Proto: $scheme` this config forwards below) — so you normally
    # need NOTHING here. Uncomment the block ONLY if you terminate TLS here and prefer nginx to
    # own the headers (e.g. serving a maintenance page the app never sees). Do NOT enable both
    # layers at once — `add_header` does not replace the app's header, it DUPLICATES it, and a
    # doubled CSP/HSTS is a misconfiguration. If you enable these, keep them in sync with
    # `src/agent_sessions/security_headers.py` (the CSP `script-src` needs the built index's
    # inline-theme-script sha256, which only the app can compute).
    #
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #   add_header X-Content-Type-Options "nosniff" always;
    #   add_header X-Frame-Options "DENY" always;
    #   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #   add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
    #   # CSP intentionally omitted here — let the app emit it (it hashes the inline theme script).

    # Terminal traffic is long-lived; don't let the proxy time it out.
    proxy_read_timeout  1h;
    proxy_send_timeout  1h;
    client_max_body_size 25m;   # allow file uploads via the compose bar

    # WebSocket terminal bridge: /ws/term/{sid}. The Upgrade/Connection
    # headers are REQUIRED or the terminal won't connect.
    location /ws/ {
        proxy_pass http://agent_sessions;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public share links (#1404). Deliberately OUTSIDE `location /`, so the optional auth_request
    # below never applies to them — a visitor has no BattleLab login. The app answers them only
    # with a valid link (and a share cookie), and 404s them all in AUTH_MODE=none.
    #
    # The viewer page. Its access line uses the token-free format above. nginx also writes the
    # request line (token included) into ERROR entries, so this location's error log is its own
    # file: keep it root-only, or point it at /dev/null.
    location /p/ {
        access_log /var/log/nginx/access.log agent_sessions_share;
        error_log  /var/log/nginx/agent-sessions-share-error.log;
        proxy_pass http://agent_sessions;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A visitor's live terminal view is a WebSocket under the SAME prefix as the visitor's API
    # calls (one share cookie, Path=/api/public), so it needs the Upgrade headers here rather
    # than under /ws/.
    location = /api/public/term {
        proxy_pass http://agent_sessions;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The visitor's API (unlock + the shared session's data). The unlock throttle buckets on the
    # client address uvicorn reports: with --proxy-headers it takes the rightmost untrusted
    # X-Forwarded-For hop, which $proxy_add_x_forwarded_for makes the real client. X-Real-IP (SET
    # to $remote_addr here, overwriting anything the client sent) is trusted from a loopback peer.
    location /api/public/ {
        proxy_pass http://agent_sessions;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The viewer's static files (#1404 P4): share.html loads hashed bundles from /assets/ and
    # the icon. They hold no data, and a visitor has no session cookie, so they stay OUTSIDE the
    # optional auth_request in `location /` — otherwise the public viewer is a blank page.
    location /assets/ {
        proxy_pass http://agent_sessions;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /favicon.svg {
        proxy_pass http://agent_sessions;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate-limit the login form.
    location = /login {
        limit_req zone=agent_sessions_login burst=5 nodelay;
        proxy_pass http://agent_sessions;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (the SPA + the JSON API).
    location / {
        proxy_pass http://agent_sessions;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OPTIONAL belt-and-braces: also gate this location on the app's own
        # session cookie at the proxy layer via auth_request (the app exposes
        # GET /api/auth-check → 204 if authed, 401 otherwise). To enable, uncomment
        # this line AND the two dedicated locations below (all three together):
        #
        # auth_request /_auth_check;
        # error_page 401 = @login_redirect;
    }

    # OPTIONAL (enable with the auth_request line above). The auth subrequest gets
    # its OWN internal location so it is NOT itself wrapped in auth_request (an
    # auth_request inside `location /` would otherwise re-enter `location /` and
    # protect the check with itself). `internal` = reachable only as a subrequest.
    #
    # location = /_auth_check {
    #     internal;
    #     proxy_pass http://agent_sessions/api/auth-check;
    #     proxy_pass_request_body off;          # subrequest needs no body
    #     proxy_set_header Content-Length "";
    #     proxy_set_header Host   $host;
    #     proxy_set_header Cookie $http_cookie; # forward the session cookie
    # }
    #
    # location @login_redirect { return 302 /login; }
}
