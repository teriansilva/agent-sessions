<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d0820" />
    <!-- interactive-widget=resizes-content: when the on-screen keyboard opens, shrink
         the layout viewport (not just the visual one) so the terminal refits above the
         keyboard instead of the input line being hidden behind it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>TermRoyale</title>
    <!-- Social / Open Graph + Twitter card (#81). Relative og:image so it resolves under
         whatever host serves the app (no hardcoded domain). -->
    <meta property="og:title" content="TermRoyale" />
    <meta property="og:description" content="Finally, a terminal with some class." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TermRoyale" />
    <meta name="twitter:description" content="Finally, a terminal with some class." />
    <meta name="twitter:image" content="/og-image.png" />
    <!-- Apply the device-cached theme before first paint so a non-Royal user doesn't see a
         Royal flash. Royal is the default (no attribute → the bare :root tokens). Mirrors
         web/src/theme/applyTheme.ts; kept inline + tiny so it runs ahead of the bundle. -->
    <script>
      (function () {
        var t = "royal";
        try {
          var s = localStorage.getItem("tr-theme");
          if (s === "dark" || s === "light" || s === "royal") t = s;
        } catch (e) {}
        // Always pin a valid data-theme so <html> never renders attribute-less or
        // with an unknown value; "royal" matches the bare :root tokens (the default).
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
