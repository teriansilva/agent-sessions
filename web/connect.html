<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>BattleLab — Remote Connect</title>
    <style>
      :root {
        --bg: #0d0e10;
        --accent: #ffb000;
        --line: rgba(255, 255, 255, 0.14);
        --dim: rgba(255, 255, 255, 0.5);
        --txt: rgba(255, 255, 255, 0.9);
        --font: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--txt);
        font-family: var(--font);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      h1 {
        font-size: 15px;
        letter-spacing: 3px;
        color: var(--accent);
        margin: 0 16px 0 0;
        text-transform: uppercase;
      }
      input {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--line);
        color: var(--txt);
        font-family: var(--font);
        font-size: 13px;
        padding: 8px 10px;
      }
      #relay { width: 260px; }
      #name { width: 150px; }
      #key { width: 200px; }
      button {
        background: var(--accent);
        color: #0d0e10;
        border: 0;
        font-family: var(--font);
        font-weight: 700;
        letter-spacing: 2px;
        padding: 9px 18px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #countdown {
        margin-left: auto;
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 13px;
        padding: 3px 12px;
        font-size: 13px;
      }
      #status {
        padding: 8px 20px;
        font-size: 12px;
        color: var(--dim);
        border-bottom: 1px solid var(--line);
      }
      #status[data-kind="error"] { color: #e5484d; }
      #status[data-kind="ok"] { color: #3fbf6f; }
      #term { flex: 1; padding: 8px; background: #000; min-height: 320px; }
      .warn {
        padding: 8px 20px;
        font-size: 11px;
        color: #e5484d;
        border-bottom: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Remote Connect</h1>
      <input id="relay" placeholder="relay base URL (https://your-box:4443)" />
      <input id="name" placeholder="console name" />
      <input id="key" type="password" placeholder="access key" />
      <button id="connect">CONNECT</button>
      <span id="countdown">--:--</span>
    </header>
    <div id="status">Enter your box's relay URL, console name and access key.</div>
    <div class="warn">
      ⚠ The access key grants full control of that machine. Never enter a key given to you by
      someone who contacted you.
    </div>
    <div id="term"></div>
    <script type="module" src="/src/homefree/connect.main.ts"></script>
  </body>
</html>
