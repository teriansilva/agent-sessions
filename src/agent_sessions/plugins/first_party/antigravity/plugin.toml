contract = 1

[identity]
id = "antigravity"
label = "Antigravity"
publisher = "battlelab"
version = "1"

[binary]
name = "agy"
aliases = ["agy"]
env_var = "AGENT_SESSIONS_AGY_BIN"
search_paths = ["~/.local/bin"]  # single Go binary from the curl installer

[session_id]
pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
mint = "adopt"  # agy has no flag to pin a conversation id (#449)

[store]
root = "~/.gemini/antigravity-cli"
env_override = "AGENT_SESSIONS_ANTIGRAVITY_DIR"
layout = "antigravity-cli"

[launch]
resume = { kind = "flag", flag = "--conversation" }
new = { kind = "bare" }
bypass = ["--dangerously-skip-permissions"]

[capabilities]
resume = true
new = true
archive = true
orchestrator_input = true
raw_tty = true

[transcript]
kind = "antigravity-brain"

[usage]
source = "plan"
kind = "agy-cli-probe"
probe_token = "/usage"

[display]
order = 50
name = "antigravity"
badge = "ag"
accent = "lime"
