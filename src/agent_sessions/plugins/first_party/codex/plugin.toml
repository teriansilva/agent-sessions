contract = 1

[identity]
id = "codex"
label = "Codex"
publisher = "battlelab"
version = "1"

[binary]
name = "codex"
env_var = "AGENT_SESSIONS_CODEX_BIN"
search_paths = ["~/.codex/bin", "~/.local/bin"]
search_npm_global = true  # vendor installs it with `npm i -g`; `doctor` also looks in npm's global bin

[session_id]
pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
mint = "adopt"  # codex mints its own rollout uuid; new sessions reconcile a new-<uuid> placeholder (#315)

[store]
root = "~/.codex/sessions"
env_override = "AGENT_SESSIONS_CODEX_SESSIONS_DIR"
layout = "codex-rollouts"

[launch]
resume = { kind = "subcommand", subcommand = "resume" }
new = { kind = "cwd-flag", flag = "--cd" }  # the rollout records this cwd; the reconcile diff filters on it
bypass = ["--dangerously-bypass-approvals-and-sandbox"]
bypass_on = "new"  # resume has no per-launch bypass flag (sandbox/approvals are config-driven)
# `--model` on NEW sessions only: whether `codex resume` honours a per-launch override is not
# verified, so a resume asking for a different model is refused rather than guessed (#1189).
model = { kind = "flag", flag = "--model" }

[capabilities]
resume = true
new = true
archive = true
handoff_target = true
seed_start = true
orchestrator_input = true
raw_tty = true

[transcript]
kind = "codex-rollout"

[usage]
source = "plan"
kind = "codex-app-server-probe"

[terminal]
repaint = "wipe"

[instructions]
files = ["AGENTS.md"]

[[models.list]]
id = "gpt-5-codex"

[[models.list]]
id = "gpt-5"

[display]
order = 30
name = "codex"
badge = "cx"
accent = "green"
