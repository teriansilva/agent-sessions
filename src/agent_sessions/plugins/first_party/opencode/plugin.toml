contract = 1
maintenance = ["sqlite-vacuum"]

[identity]
id = "opencode"
label = "opencode"
publisher = "battlelab"
version = "1"

[binary]
name = "opencode"
env_var = "AGENT_SESSIONS_OPENCODE_BIN"
search_paths = ["~/.opencode/bin", "~/.local/bin"]

[session_id]
pattern = "^ses_[A-Za-z0-9]+$"
mint = "adopt"  # opencode mints its own ses_ id (#127)

[store]
root = "~/.local/share/opencode"
layout = "opencode-sqlite"
[store.paths]
db = "opencode.db"
log = "log/opencode.log"
[store.path_env]
db = "AGENT_SESSIONS_OPENCODE_DB"
log = "AGENT_SESSIONS_OPENCODE_LOG"

[launch]
resume = { kind = "positional-dir", flag = "--session" }  # bypass is config-side for opencode
new = { kind = "positional-dir" }
admission = "sqlite-store-shared"

[capabilities]
resume = true
new = true
archive = true
handoff_target = true
seed_start = true
orchestrator_input = true
raw_tty = true

[transcript]
kind = "opencode-sqlite"
strict = true

[usage]
source = "tokens"
kind = "opencode-store-query"

[unattended]
start_evidence = "opencode-log"

[display]
order = 20
name = "opencode"
badge = "oc"
accent = "teal"
id_prefix = "ses_"
