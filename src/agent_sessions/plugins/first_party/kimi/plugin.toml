contract = 1

[identity]
id = "kimi"
label = "Kimi Code"
publisher = "battlelab"
version = "1"

[binary]
name = "kimi"
env_var = "AGENT_SESSIONS_KIMI_BIN"
search_paths = ["~/.kimi-code/bin", "~/.local/bin"]  # the installer only appends ~/.kimi-code/bin to the shell rc

[session_id]
pattern = "^session_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
mint = "adopt"  # ids are session_<uuid>, minted by kimi (#714)

[store]
root = "~/.kimi-code"
env_override = "AGENT_SESSIONS_KIMI_DIR"
layout = "kimi-code"

[launch]
resume = { kind = "flag", flag = "-S" }
new = { kind = "bare" }
bypass = ["-y"]

[capabilities]
resume = true
new = true
archive = true
handoff_target = true
seed_start = true
orchestrator_input = true
raw_tty = true

[transcript]
kind = "kimi-wire"

[usage]
source = "plan"
kind = "kimi-web-usage-probe"  # kimi 2.1+ (#1239)
access = "kimi-wire-auth-error"

[terminal]
repaint = "wipe"

[instructions]
files = ["AGENTS.md"]

# The model is chosen in the engine's own configuration (#1189): pickers offer `default` only.
[models]
configured_elsewhere = true

[display]
order = 60
name = "kimi"
badge = "ki"
accent = "magenta"
id_prefix = "session_"
