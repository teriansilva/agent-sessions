contract = 1

[identity]
id = "shell"
label = "Shell"
publisher = "battlelab"
version = "1"
kind = "terminal"  # no agent (#636): the validator refuses orchestrator input, raw TTY and seeding

[binary]
name = "bash"
aliases = ["bash"]
env_var = "AGENT_SESSIONS_BASH_BIN"
search_paths = ["/bin", "/usr/bin"]

[session_id]
pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
mint = "pinned"

[store]
root = "~/.claude/shell-sessions"
env_override = "AGENT_SESSIONS_SHELL_DIR"
layout = "shell-records"

[launch]
resume = { kind = "fresh" }  # a relaunch is a fresh shell; there is no transcript to restore
new = { kind = "bare" }
base_args = ["-l"]

[capabilities]
resume = true
new = true
archive = true

[display]
order = 90
name = "shell"
badge = "sh"
accent = "slate"
