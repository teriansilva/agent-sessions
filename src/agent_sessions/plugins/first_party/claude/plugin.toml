contract = 1
verify = ["binary", "version", "store", "new", "resume", "transcript", "usage"]

[identity]
id = "claude"
label = "Claude Code"
publisher = "battlelab"
version = "1"

[binary]
name = "claude"
env_var = "AGENT_SESSIONS_CLAUDE_BIN"
search_paths = ["~/.local/bin"]
version_flag = "--version"

[session_id]
pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
mint = "pinned"  # `--session-id` lets BattleLab key the socket before claude writes its JSONL
legacy_bare_id = true

[store]
root = "~/.claude"
layout = "claude-projects"
[store.paths]
sessions = "projects"
archive = "projects-archive"

[launch]
resume = { kind = "flag", flag = "--resume" }
new = { kind = "pin-flag", flag = "--session-id" }
bypass = ["--dangerously-skip-permissions"]
# `--model` on new AND resume: claude honours it when it resumes a conversation (#1189).
model = { kind = "flag", flag = "--model", on_resume = true }

[capabilities]
resume = true
new = true
archive = true
handoff_target = true
seed_start = true  # handoff target (#597): the seed arrives as a bracketed paste, never argv
orchestrator_input = true
raw_tty = true  # Ink TUI: its PTY must stay raw (#804)
owns_transcript = true

[transcript]
kind = "claude-jsonl"

[usage]
source = "plan"
kind = "claude-cli-probe"
probe_token = "/usage"

[terminal]
ready = "claude-first-paint"
menu = "claude-numbered"
menu_digit_submits = true
# The tool-permission dialog (#1213): parsed for the operator only, answered by its digit.
permission = "claude-permission"

[unattended]
start_evidence = "claude-sessions"

[instructions]
files = ["CLAUDE.md"]

# Vendor-documented ids at authoring time (#1189). Aliases are claude's own `--model` shorthands,
# canonicalised to the id before anything is stored or launched. Newer ids: Settings → Agents.
[[models.list]]
id = "claude-opus-5"
context_window = 1000000
aliases = ["opus"]

[[models.list]]
id = "claude-sonnet-5"
context_window = 1000000
aliases = ["sonnet"]

[[models.list]]
id = "claude-haiku-4-5"
context_window = 200000
aliases = ["haiku"]

[[models.list]]
id = "claude-fable-5-1"
context_window = 1000000

[[models.list]]
id = "claude-opus-4-8"
context_window = 1000000

[[models.list]]
id = "claude-sonnet-4-6"
context_window = 1000000

[display]
order = 10
name = "claude"
badge = "cc"
accent = "amber"
