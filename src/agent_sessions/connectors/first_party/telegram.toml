# The bundled Telegram connector (#1832): a bot the Commander creates with @BotFather. It reads
# nothing; it lists the chats the bot can see, and (#1833) sends what the Commander taps. Every
# value is a member of a set in connectors/kinds.py; an unknown field anywhere refuses it.
contract = 1

[identity]
id = "telegram"
label = "Telegram"
publisher = "battlelab"
version = "1"
category = "messenger"

[adapter]
kind = "telegram-bot"

[origin]
mode = "fixed"
fixed = "https://api.telegram.org"

[auth]
kind = "path-token"
scheme = "bot"
scopes = ["bot-token"]

[capabilities]
read = []
send = ["message"]

[docs]
setup = "Create a bot for BattleLab with @BotFather in Telegram (/newbot) and paste its token. Use a bot of its own: one with a webhook can't list its chats here."
