<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{{ sid }} — agent-sessions</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e1e; }
    #term { position: absolute; inset: 0; padding: 4px; }
    #status { position: absolute; top: 6px; right: 10px; z-index: 5; font: 12px system-ui;
              color: #cfe; background: rgba(18,38,28,.9); border: 1px solid #2a6;
              border-radius: 6px; padding: 3px 8px; display: none; }
    #status.show { display: block; }
  </style>
</head>
<body>
  <div id="term"></div>
  <div id="status"></div>
  <script>
    // Self-owned xterm.js terminal over the app's authenticated /ws/term socket
    // (issue #49). No ttyd, no Zellij: native scrollback, native copyOnSelect,
    // native touch scroll. The session cookie rides the same-origin ws handshake.
    const SID = {{ sid_json|safe }};
    const WS_QUERY = {{ ws_query_json|safe }};  // "?new=1&cwd=…" for a fresh session, else ""
    const CSRF = {{ csrf_json|safe }};           // for /api/upload (image paste)
    const statusEl = document.getElementById('status');
    const setStatus = (msg) => {
      if (!msg) { statusEl.className = ''; return; }
      statusEl.textContent = msg; statusEl.className = 'show';
    };

    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
      scrollback: 10000,
      macOptionIsMeta: true,
      theme: { background: '#1e1e1e' },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.loadAddon(new WebLinksAddon.WebLinksAddon());
    // Don't forward Ctrl/Cmd+V to the agent. The browser fires a paste event we
    // handle ourselves (image → upload + type path; text → xterm pastes). If the
    // Ctrl-V keystroke (\x16) also reached the agent, claude/codex would try to read
    // the server-side (empty) clipboard → "no image found in clipboard".
    term.attachCustomKeyEventHandler((e) => {
      if (e.type === 'keydown' && (e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V')) {
        return false;
      }
      return true;
    });
    const host = document.getElementById('term');
    term.open(host);
    const refit = () => { try { fit.fit(); } catch (_) {} };
    refit();
    // Fill the pane reliably: refit whenever the container actually changes size
    // (iframe layout settling, sidebar collapse, on-screen keyboard) — more robust
    // than window 'resize' alone. sendResize() (defined below) pushes to the PTY.
    let roTimer = null;
    new ResizeObserver(() => {
      clearTimeout(roTimer);
      roTimer = setTimeout(() => { refit(); if (typeof sendResize === 'function') sendResize(); }, 60);
    }).observe(host);

    // Native select-to-copy — no Zellij mouse-mode workaround needed.
    term.onSelectionChange(() => {
      const sel = term.getSelection();
      if (sel) { navigator.clipboard?.writeText(sel).catch(() => {}); }
    });

    // Deliberate server-side rejects — never reconnect on these (would hammer the
    // backend, esp. 4500 on a misconfigured launch). Kept explicit, not a range.
    const NO_RETRY = new Set([4401, 4403, 4404, 4500]);
    let ws, reconnectTimer = null, alive = false;
    const wsUrl = () =>
      (location.protocol === 'https:' ? 'wss://' : 'ws://') +
      location.host + '/ws/term/' + encodeURIComponent(SID) + WS_QUERY;

    // Only send a resize when the grid actually changed. A bare scrollbar toggle
    // nudges the pixel size (ResizeObserver fires) without changing cols/rows; sending
    // a resize anyway would SIGWINCH the agent → full repaint → visible flicker loop.
    let lastCols = 0, lastRows = 0;
    const sendResize = () => {
      if (!alive) return;
      if (term.cols === lastCols && term.rows === lastRows) return;
      lastCols = term.cols; lastRows = term.rows;
      ws.send(JSON.stringify({ t: 'r', cols: term.cols, rows: term.rows }));
    };

    function connect() {
      setStatus('connecting…');
      ws = new WebSocket(wsUrl());
      ws.binaryType = 'arraybuffer';
      // Force the size on every (re)connect — a fresh dtach pty defaults to 80x24.
      ws.onopen = () => { alive = true; setStatus(''); fit.fit(); lastCols = lastRows = 0; sendResize(); term.focus(); };
      ws.onmessage = (ev) => {
        if (typeof ev.data === 'string') {
          // String frames are JSON control frames (e.g. {"t":"seq","n":N} from
          // delta-resume) — never write them to the terminal. Raw PTY output is binary.
          try { const m = JSON.parse(ev.data); if (m && m.t) return; } catch (_) {}
          term.write(ev.data);
        } else {
          term.write(new Uint8Array(ev.data));
        }
      };
      ws.onclose = (ev) => {
        alive = false;
        const REJECT = {
          4401: 'session expired — please sign in again',
          4403: 'blocked (origin mismatch)',
          4404: 'session not found or ended',
          4500: 'couldn’t start this session',
        };
        if (NO_RETRY.has(ev.code)) { setStatus(REJECT[ev.code] || 'unavailable'); return; }
        setStatus('disconnected — reconnecting…');
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 1200);
      };
      ws.onerror = () => { try { ws.close(); } catch (_) {} };
    }

    term.onData((d) => { if (alive) ws.send(JSON.stringify({ t: 'i', d })); });
    term.onResize(sendResize);
    let fitTimer = null;
    addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(() => { fit.fit(); }, 80); });

    // Parent (the sidebar) drives the compose box + nav keys via postMessage; we
    // forward to the same ws the keyboard uses. Same-origin only. Phase 4 of #49.
    const KEYSEQ = {
      up: '\x1b[A', down: '\x1b[B', right: '\x1b[C', left: '\x1b[D',
      enter: '\r', esc: '\x1b', tab: '\t',
      ctrlc: '\x03', ctrlu: '\x15', ctrla: '\x01', ctrlk: '\x0b',
    };
    const sendInput = (d) => { if (alive && d) ws.send(JSON.stringify({ t: 'i', d })); };
    addEventListener('message', (e) => {
      if (e.origin !== location.origin || !e.data || typeof e.data !== 'object') return;
      const m = e.data;
      if (m.t === 'input') sendInput(String(m.d || ''));
      else if (m.t === 'key') sendInput(KEYSEQ[m.name] || '');  // sidebar posts {t:'key', name}
      else if (m.t === 'clear') sendInput('\x01\x0b');                 // Ctrl-A + Ctrl-K
      else if (m.t === 'paste') sendInput('\x1b[200~' + String(m.d || '') + '\x1b[201~');  // bracketed
      else if (m.t === 'focus') term.focus();
    });

    // Image paste/drop → upload + type the file PATH into the terminal. Engine-agnostic:
    // the agent (claude/opencode/codex/gemini) just receives a path string it can read.
    // Text paste falls through to xterm. Same /api/upload contract as the sidebar.
    const _imgFiles = (dt) => {
      const out = [];
      if (!dt) return out;
      for (const f of (dt.files || [])) out.push(f);
      if (!out.length) for (const it of (dt.items || [])) {
        if (it.kind === 'file') { const f = it.getAsFile(); if (f) out.push(f); }
      }
      return out.filter((f) => f.type && f.type.startsWith('image/'));
    };
    async function uploadAndType(file) {
      try {
        const fd = new FormData();
        fd.append('file', file, file.name || 'pasted.png');
        const r = await fetch('/api/upload', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'X-CSRF-Token': CSRF }, body: fd,
        });
        if (!r.ok) throw new Error(r.status);
        const { path } = await r.json();
        sendInput(path + ' ');
        setStatus('📎 ' + path.split('/').pop()); setTimeout(() => setStatus(''), 2500);
      } catch (_) { setStatus('image upload failed'); setTimeout(() => setStatus(''), 3000); }
    }
    document.addEventListener('paste', (e) => {
      const imgs = _imgFiles(e.clipboardData);
      if (!imgs.length) return;                 // text paste → xterm handles it
      e.preventDefault(); e.stopPropagation();
      imgs.forEach(uploadAndType);
    }, { capture: true });
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => {
      const imgs = _imgFiles(e.dataTransfer);
      if (!imgs.length) return;
      e.preventDefault(); e.stopPropagation();
      imgs.forEach(uploadAndType);
    }, { capture: true });

    connect();
  </script>
</body>
</html>
