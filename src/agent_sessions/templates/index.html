<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>agent-sessions</title>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* Fixed full-screen app: only the sidebar scrolls. overflow:hidden on the
     document kills the spurious page-level scrollbar (the iframe's default
     inline baseline-gap pushed layout a few px past 100vh). */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0a; color: #e6e6e6;
               font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; overflow: hidden; transition: grid-template-columns .15s ease; }
  #app.collapsed { grid-template-columns: 0 1fr; }
  @media (max-width: 800px) { #app { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
                              /* must also reset columns to 1fr: the general #app.collapsed rule
                                 sets `grid-template-columns: 0 1fr` (higher specificity than the
                                 media `#app`), which would otherwise make this a 2x2 grid and
                                 auto-place the terminal into the 0-height first row → blank screen. */
                              #app.collapsed { grid-template-columns: 1fr; grid-template-rows: 0 1fr; } }
  aside { background: #111; border-right: 1px solid #222; overflow-y: auto; min-width: 0; }
  #app.collapsed aside { overflow: hidden; border: 0; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  /* terminal pane wrapper: clip any sub-pixel overflow so no scrollbar shows */
  .term { position: relative; min-width: 0; overflow: hidden; }
  header { padding: 10px 12px; display: flex; gap: 8px; align-items: center; justify-content: space-between;
           border-bottom: 1px solid #222; background: #111; position: sticky; top: 0; z-index: 2; }
  header strong { color: #8af; font-size: 13px; letter-spacing: .03em; }
  .row { padding: 9px 12px; border-bottom: 1px solid #1a1a1a; cursor: pointer; display: flex; align-items: flex-start; gap: 8px; }
  .row:hover { background: #181818; }
  .row.sticky { background: #122; }
  .row .body { flex: 1; min-width: 0; }
  .title { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ebadge { display: inline-block; font-size: 9px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
            padding: 1px 4px; margin-right: 5px; border-radius: 3px; background: #234; color: #9cf; vertical-align: middle; }
  .ebadge.opencode { background: #3a2f12; color: #fc9; }
  .meta { color: #888; font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acts { display: flex; gap: 4px; opacity: .35; }
  .row:hover .acts { opacity: 1; }
  button, select, input { font: inherit; }
  .iconbtn { background: #222; color: #ccc; border: 1px solid #333; border-radius: 3px; cursor: pointer; padding: 2px 6px; }
  .iconbtn:hover { background: #2c2c2c; }
  .topbtn { background: #1a4; color: #fff; border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  .topbtn:hover { background: #1c5; }
  .chip { background: #1c1c1c; border: 1px solid #2a2a2a; color: #aaa; border-radius: 12px; padding: 2px 9px; cursor: pointer; font-size: 12px; }
  .chip.on { background: #234; color: #cde; border-color: #356; }
  .fbar { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 6px; }
  .fbar input, .fbar select { width: 100%; background: #181818; color: #fff; border: 1px solid #2a2a2a; border-radius: 4px; padding: 6px 8px; }
  .fbar .selects { display: flex; gap: 6px; }
  .fbar select { flex: 1; min-width: 0; }
  .fbar .clear { flex: 0 0 auto; }
  .empty { color: #888; padding: 14px 12px; font-size: 12px; }
  .collapse-tab { position: absolute; left: 0; top: 50%; transform: translateY(-50%); z-index: 5;
                  background: #222; border: 1px solid #333; border-left: 0; color: #8af; cursor: pointer;
                  border-radius: 0 6px 6px 0; padding: 10px 4px; display: none; }
  #app.collapsed .collapse-tab { display: block; }
  .err { color: #f88; padding: 8px 12px; font-size: 12px; }
  .renameinput { width: 100%; background: #181818; color: #fff; border: 1px solid #356; border-radius: 3px; padding: 3px 6px; }
  .sentinel { height: 1px; }
  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 10; }
  .modal { background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; padding: 18px; width: min(420px, 92vw);
           display: flex; flex-direction: column; gap: 12px; }
  .modal h2 { margin: 0; font-size: 16px; color: #8af; }
  .modal label { font-size: 12px; color: #aaa; display: block; margin-bottom: 4px; }
  .modal select, .modal input[type=text] { width: 100%; background: #181818; color: #fff;
           border: 1px solid #2a2a2a; border-radius: 4px; padding: 8px; }
  .modal .check { display: flex; align-items: center; gap: 8px; color: #ddd; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div id="app" :class="{ collapsed }" x-data="sidebar()" x-init="init()">
  <button class="collapse-tab" @click="toggleCollapse()" title="Show sidebar">›</button>

  <aside>
    <header>
      <strong>agent-sessions</strong>
      <div style="display:flex; gap:6px; align-items:center;">
        <button class="topbtn" @click="openNew()" type="button">+ New</button>
        <button class="iconbtn" @click="refit()" title="Refit terminal to this screen" type="button">⤢</button>
        <button class="iconbtn" @click="toggleCollapse()" title="Collapse sidebar" type="button">‹</button>
        <button class="iconbtn" @click="logout()" type="button">⎋</button>
      </div>
    </header>

    <div style="padding:8px 12px; display:flex; gap:6px;">
      <span class="chip" :class="{ on: !showArchived }" @click="setArchived(false)">Active</span>
      <span class="chip" :class="{ on: showArchived }" @click="setArchived(true)">Archived</span>
    </div>

    <div class="fbar">
      <input type="text" placeholder="Search titles…" x-model="q" @input="onSearchInput()"
             aria-label="Search session titles">
      <div class="selects">
        <select x-model="projectFilter" @change="reload()" aria-label="Filter by project">
          <option value="">All projects</option>
          <template x-for="p in facets.projects" :key="p">
            <option :value="p" x-text="shortCwd(p)"></option>
          </template>
        </select>
        <select x-show="facets.engines.length > 1" x-model="engineFilter" @change="reload()"
                aria-label="Filter by agent">
          <option value="">All agents</option>
          <template x-for="e in facets.engines" :key="e">
            <option :value="e" x-text="e"></option>
          </template>
        </select>
        <button class="iconbtn clear" type="button" title="Clear filters"
                x-show="q || projectFilter || engineFilter" @click="clearFilters()">✕</button>
      </div>
    </div>

    <template x-for="s in sessions" :key="s.id">
      <div class="row" :class="{ sticky: s.sticky }" @click="open(s)">
        <div class="body">
          <template x-if="editing !== s.id">
            <div class="title">
              <template x-if="facets.engines.length > 1"><span class="ebadge" :class="s.engine" x-text="s.engine === 'opencode' ? 'oc' : 'cc'"></span></template>
              <span x-text="s.title || '(untitled)'"></span>
            </div>
          </template>
          <template x-if="editing === s.id">
            <input class="renameinput" type="text" x-model="editTitle"
                   @click.stop @keydown.enter.stop="commitRename(s)" @keydown.escape.stop="editing=null"
                   @blur="commitRename(s)" x-init="$nextTick(()=>$el.focus())">
          </template>
          <div class="meta" x-text="shortCwd(s.cwd) + ' • ' + ago(s.last_mtime)"></div>
        </div>
        <div class="acts" @click.stop>
          <button class="iconbtn" @click="startRename(s)" title="Rename">✎</button>
          <template x-if="!showArchived">
            <button class="iconbtn" @click="archive(s)" title="Archive">🗄</button>
          </template>
          <template x-if="showArchived">
            <button class="iconbtn" @click="unarchive(s)" title="Unarchive">↩</button>
          </template>
        </div>
      </div>
    </template>

    <template x-if="!loading && sessions.length === 0">
      <div class="empty"
           x-text="(q || projectFilter || engineFilter) ? 'No sessions match — clear filters.' : (showArchived ? 'No archived sessions.' : 'No sessions yet.')"></div>
    </template>

    <div class="sentinel" x-ref="sentinel"></div>
    <template x-if="loading"><div class="meta" style="padding:10px 12px;">loading…</div></template>
    <template x-if="err"><div class="err" x-text="err"></div></template>
  </aside>

  <div class="term">
    <iframe x-ref="term" src="/terminal/" title="agent-main"></iframe>
  </div>

  <!-- New-session modal -->
  <template x-if="showModal">
    <div class="modal-bg" @click.self="showModal=false">
      <div class="modal">
        <h2>New session</h2>
        <div>
          <label>Project folder</label>
          <select x-model="newCwd">
            <template x-for="p in projects" :key="p.cwd">
              <option :value="p.cwd" x-text="p.label"></option>
            </template>
          </select>
        </div>
        <div>
          <label>Session name</label>
          <input type="text" x-model="newName" placeholder="e.g. refactor auth" @keydown.enter="createNew()">
        </div>
        <label class="check">
          <input type="checkbox" x-model="newBypass">
          bypass permissions (skip trust + tool prompts)
        </label>
        <div class="actions">
          <button class="iconbtn" @click="showModal=false">Cancel</button>
          <button class="topbtn" @click="createNew()" :disabled="!newCwd">Create</button>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
const CSRF = {{ csrf | tojson }};
const PAGE = 20;
function sidebar() {
  return {
    sessions: [], projects: [], err: null, loading: false,
    nextOffset: 0, showArchived: false,
    q: '', projectFilter: '', engineFilter: '', facets: { projects: [], engines: [] },
    collapsed: localStorage.getItem('as_collapsed') === '1',
    editing: null, editTitle: '',
    showModal: false, newCwd: '', newName: '', newBypass: true,
    _obs: null, _searchT: null, _gen: 0,

    async init() {
      await this.reload();
      this._obs = new IntersectionObserver((es) => {
        if (es[0].isIntersecting) this.loadMore();
      }, { root: this.$root, rootMargin: '200px' });
      this.$nextTick(() => this._obs.observe(this.$refs.sentinel));
      // When the desktop regains focus/visibility (e.g. after driving the session
      // from a phone, which shrinks the shared Zellij grid to the smaller width),
      // nudge the terminal to re-fit so it reclaims the full screen.
      window.addEventListener('focus', () => this.refit());
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.refit(); });
    },
    async reload() {
      // Bump the generation so any in-flight page load is discarded, clear the
      // accumulated rows, and fetch from the top of the (possibly filtered) set.
      const gen = ++this._gen;
      this.sessions = []; this.nextOffset = 0; this.err = null;
      await this._fetchPage(gen);
    },
    async loadMore() {
      if (this.loading || this.nextOffset === null) return;
      await this._fetchPage(this._gen);
    },
    async _fetchPage(gen) {
      if (this.nextOffset === null) return;
      this.loading = true;
      try {
        const params = new URLSearchParams({ limit: PAGE, offset: this.nextOffset,
                                             archived: this.showArchived ? 1 : 0 });
        if (this.q.trim()) params.set('q', this.q.trim());
        if (this.projectFilter) params.set('project', this.projectFilter);
        if (this.engineFilter) params.set('engine', this.engineFilter);
        const r = await fetch(`/api/sessions?${params.toString()}`, { credentials: 'same-origin' });
        if (!r.ok) throw new Error('GET /api/sessions ' + r.status);
        const d = await r.json();
        if (gen !== this._gen) return;  // a newer reload superseded this fetch
        this.sessions.push(...d.sessions);
        this.nextOffset = d.next_offset;
        if (d.facets) this.facets = d.facets;
      } catch (e) { if (gen === this._gen) this.err = e.message; }
      finally { if (gen === this._gen) this.loading = false; }
    },
    setArchived(v) {
      if (v === this.showArchived) return;
      // project/engine option lists are scope-specific; reset them on toggle
      // (keep the title query, which applies across both scopes).
      this.showArchived = v; this.projectFilter = ''; this.engineFilter = ''; this.reload();
    },
    onSearchInput() { clearTimeout(this._searchT); this._searchT = setTimeout(() => this.reload(), 250); },
    clearFilters() { this.q = ''; this.projectFilter = ''; this.engineFilter = ''; this.reload(); },

    async post(url, body) {
      const r = await fetch(url, { method: 'POST', credentials: 'same-origin',
        headers: { 'X-CSRF-Token': CSRF, 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined });
      if (!r.ok) throw new Error(url + ' ' + r.status + ': ' + await r.text());
      return r;
    },
    async open(s) { try { await this.post(`/api/sessions/${encodeURIComponent(s.id)}/open`); if (this.collapsed===false && window.innerWidth<=800) this.collapsed=true; } catch (e) { this.err = e.message; } },
    startRename(s) { this.editing = s.id; this.editTitle = s.title || ''; },
    async commitRename(s) {
      if (this.editing !== s.id) return;
      const t = this.editTitle.trim(); this.editing = null;
      if (!t || t === s.title) return;
      try { await this.post(`/api/sessions/${encodeURIComponent(s.id)}/rename`, { title: t }); s.title = t; }
      catch (e) { this.err = e.message; }
    },
    async archive(s) { try { await this.post(`/api/sessions/${encodeURIComponent(s.id)}/archive`); this.sessions = this.sessions.filter(x => x.id !== s.id); } catch (e) { this.err = e.message; } },
    async unarchive(s) { try { await this.post(`/api/sessions/${encodeURIComponent(s.id)}/unarchive`); this.sessions = this.sessions.filter(x => x.id !== s.id); } catch (e) { this.err = e.message; } },

    async openNew() {
      this.showModal = true; this.newName = ''; this.newBypass = true;
      try {
        const r = await fetch('/api/projects', { credentials: 'same-origin' });
        this.projects = (await r.json()).projects;
        if (this.projects.length && !this.newCwd) this.newCwd = this.projects[0].cwd;
      } catch (e) { this.err = e.message; }
    },
    async createNew() {
      if (!this.newCwd) return;
      try {
        await this.post('/api/projects/new', { cwd: this.newCwd, name: this.newName || 'session', bypass_permissions: this.newBypass });
        this.showModal = false;
        if (window.innerWidth <= 800) this.collapsed = true;
        // give claude a beat to write the JSONL, then refresh the list
        setTimeout(() => this.reload(), 1500);
      } catch (e) { this.err = e.message; }
    },

    refit() {
      // Force ttyd/xterm to recompute cols/rows by briefly nudging the iframe
      // height: the inner window's resize handler re-fits and pushes the new size
      // to Zellij, so the desktop reclaims width a smaller device left behind.
      // (fit() measures both dimensions, so a height nudge also restores width.)
      const f = this.$refs.term;
      if (!f) return;
      f.style.height = 'calc(100% - 1px)';
      setTimeout(() => { f.style.height = ''; }, 80);
    },
    toggleCollapse() { this.collapsed = !this.collapsed; localStorage.setItem('as_collapsed', this.collapsed ? '1' : '0'); },
    shortCwd(c) { return (c || '').replace(/^\/home\/[^/]+\//, '~/'); },
    ago(ts) {
      const s = Math.max(0, Date.now()/1000 - ts);
      if (s < 3600) return Math.floor(s/60) + 'm ago';
      if (s < 86400) return Math.floor(s/3600) + 'h ago';
      return Math.floor(s/86400) + 'd ago';
    },
    async logout() { try { const r = await this.post('/logout'); if (r.redirected) location.href = r.url; else location.href='/login'; } catch (e) { this.err = e.message; } },
  };
}
</script>
</body>
</html>
