<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>agent-sessions</title>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* Fixed full-screen app: only the sidebar scrolls. overflow:hidden on the
     document kills the spurious page-level scrollbar (the iframe's default
     inline baseline-gap pushed layout a few px past 100vh). */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0a; color: #e6e6e6;
               font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  /* 100dvh (dynamic viewport height) so the mobile URL bar / bottom nav don't push
     the terminal off-screen — the classic 100vh crop. 100vh first as a fallback for
     browsers without dvh. */
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; height: 100dvh; overflow: hidden; transition: grid-template-columns .15s ease; }
  #app.collapsed { grid-template-columns: 0 1fr; }
  @media (max-width: 800px) { #app { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; grid-template-rows: 45dvh 1fr; }
                              /* must also reset columns to 1fr: the general #app.collapsed rule
                                 sets `grid-template-columns: 0 1fr` (higher specificity than the
                                 media `#app`), which would otherwise make this a 2x2 grid and
                                 auto-place the terminal into the 0-height first row → blank screen. */
                              #app.collapsed { grid-template-columns: 1fr; grid-template-rows: 0 1fr; } }
  aside { background: #111; border-right: 1px solid #3a3a3a; overflow-y: auto; min-width: 0; }
  #app.collapsed aside { overflow: hidden; border: 0; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  /* terminal pane wrapper: clip any sub-pixel overflow so no scrollbar shows.
     Flex column so the current-session header (.termbar) sits above the iframe. */
  .term { position: relative; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
  /* The iframe lives in .termwrap so the user-set scale (a CSS transform on the iframe)
     can oversize+shrink it for more columns without disturbing the flex layout / compose box. */
  .termwrap { flex: 1 1 auto; position: relative; overflow: hidden; min-height: 0; }
  .termwrap iframe { width: 100%; height: 100%; transform-origin: top left; }
  /* Current-session header — which session this terminal is showing. Visible on
     desktop AND mobile (on mobile the sidebar is collapsed, so this is the only
     place you can see what you're working in). */
  .termbar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 4px 10px;
             min-height: 26px; background: #0d0d0d; border-bottom: 1px solid #3a3a3a; color: #cdd;
             font-size: 12px; white-space: nowrap; overflow: hidden; cursor: pointer; }
  .termbar .t { overflow: hidden; text-overflow: ellipsis; }
  .termbar .muted { color: #666; }
  .termbar .hb { color: #8af; flex: 0 0 auto; font-size: 13px; } /* tap-for-list hint */
  header { padding: 10px 12px; display: flex; gap: 8px; align-items: center; justify-content: space-between;
           border-bottom: 1px solid #3a3a3a; background: #111; position: sticky; top: 0; z-index: 2; }
  header strong { color: #8af; font-size: 13px; letter-spacing: .03em; }
  .row { padding: 9px 12px; border-bottom: 1px solid #1a1a1a; cursor: pointer; display: flex; align-items: flex-start; gap: 8px; }
  .row:hover { background: #181818; }
  .row.sticky { background: #122; }
  .row.current { background: #14233a; box-shadow: inset 3px 0 0 #4a9eff; }
  /* "Where you're working" marker — orange dot on the session open in the terminal. */
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff9000;
         margin-right: 6px; vertical-align: middle; box-shadow: 0 0 5px rgba(255,144,0,.7); }
  .row .body { flex: 1; min-width: 0; }
  .title { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ebadge { display: inline-block; font-size: 9px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
            padding: 1px 4px; margin-right: 5px; border-radius: 3px; background: #234; color: #9cf; vertical-align: middle; }
  .ebadge.opencode { background: #3a2f12; color: #fc9; }
  .meta { color: #888; font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acts { display: flex; gap: 4px; opacity: .35; }
  .row:hover .acts { opacity: 1; }
  button, select, input { font: inherit; }
  .iconbtn { background: #222; color: #ccc; border: 1px solid #333; border-radius: 3px; cursor: pointer; padding: 2px 6px; }
  .iconbtn:hover { background: #2c2c2c; }
  .topbtn { background: #1a4; color: #fff; border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  .topbtn:hover { background: #1c5; }
  .chip { background: #1c1c1c; border: 1px solid #2a2a2a; color: #aaa; border-radius: 12px; padding: 2px 9px; cursor: pointer; font-size: 12px; }
  .chip.on { background: #234; color: #cde; border-color: #356; }
  .fbar { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 6px; }
  .fbar input, .fbar select { width: 100%; background: #181818; color: #fff; border: 1px solid #2a2a2a; border-radius: 4px; padding: 6px 8px; }
  .fbar .selects { display: flex; gap: 6px; }
  .fbar select { flex: 1; min-width: 0; }
  .fbar .clear { flex: 0 0 auto; }
  .empty { color: #888; padding: 14px 12px; font-size: 12px; }
  /* Desktop scroll-strip: Zellij owns the scrollback (alt-screen) so xterm has no real
     scrollbar — this grab-and-drag gutter on the right edge feeds Zellij scroll via
     wheel events. Relative (no position thumb — Zellij's scroll position isn't knowable).
     Desktop only; mobile uses swipe. */
  .scrollstrip { position: absolute; top: 0; right: 0; width: 12px; height: 100%; z-index: 6;
                 display: none; cursor: grab; background: rgba(50,50,60,.22); }
  .scrollstrip:hover { background: rgba(80,80,110,.40); }
  .scrollstrip:active { cursor: grabbing; background: rgba(110,110,150,.5); }
  @media (min-width: 801px) { .scrollstrip { display: block; } }
  /* Attach control (paste/drop/pick a file as context) + transient upload notice. */
  .upnotice { position: absolute; left: 8px; right: 8px; top: 34px; z-index: 7; cursor: pointer;
              background: rgba(18,38,28,.96); border: 1px solid #2a6; color: #cfe; border-radius: 6px;
              padding: 8px 10px; font-size: 12px; white-space: normal; word-break: break-all; }
  /* Compose panel: a real <textarea> (autocomplete-friendly) sent to the terminal
     in ONE paste — sidesteps the mobile-keyboard/IME garble you get typing straight
     into xterm. Collapsible; holds the nav keys + attach + send. Mobile-only (desktop
     types directly in the terminal). The nav keys (arrows/Esc/Tab/^C) inject keystrokes
     so TUI menus — e.g. Claude's native /-command menu or resume prompt — are operable. */
  .compose-toggle { position: absolute; left: 8px; bottom: 14px; z-index: 6; display: block;
                    width: 56px; height: 56px; border-radius: 50%; background: rgba(28,28,28,.88);
                    color: #cde; border: 1px solid #3a3a3a; font-size: 26px; line-height: 1; cursor: pointer; }
  /* Docked BELOW the terminal: in-flow flex child of .term, so the iframe (flex:1)
     shrinks above it and the compose box never overlays the session. Desktop + mobile. */
  .compose { position: relative; flex: 0 0 auto; display: none; flex-direction: column; gap: 6px; padding: 8px;
             background: rgba(12,12,12,.97); border-top: 1px solid #3a3a3a; }
  .compose.open { display: flex; }
  .compose textarea { width: 100%; max-height: 28vh; resize: none; background: #181818; color: #fff;
                      border: 1px solid #2a2a2a; border-radius: 6px; padding: 8px; font: inherit; }
  /* Header row ABOVE the textarea: attachment pills (left) + window-style close (right). */
  .compose-head { display: flex; align-items: center; gap: 6px; }
  .compose-head .spacer { flex: 1; }
  .compose .xclose { flex: 0 0 auto; width: 30px; height: 26px; display: grid; place-items: center;
                     background: rgba(40,40,46,.9); color: #cde; border: 1px solid #3a3a3a; border-radius: 5px;
                     font-size: 13px; line-height: 1; cursor: pointer; }
  .compose .xclose:hover { background: #c0392b; color: #fff; border-color: #c0392b; }
  /* Attached-file pills (path goes to the session on Send, not into the box). */
  .compose .pills { display: flex; flex-wrap: wrap; gap: 5px; }
  .compose .pill { display: inline-flex; align-items: center; gap: 4px; max-width: 70%; background: #16263a;
                   border: 1px solid #356; color: #cde; border-radius: 12px; padding: 2px 4px 2px 9px; font-size: 11px; }
  .compose .pill .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .compose .pill button { background: none; border: 0; color: #9ab; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
  .compose .pill button:hover { color: #f88; }
  .compose .crow { display: flex; align-items: center; gap: 6px; }
  .compose .crow .spacer { flex: 1; }
  .compose .send { background: #1a4; color: #fff; border: 0; height: 36px; padding: 0 16px;
                   border-radius: 8px; font-weight: 600; cursor: pointer; }
  .compose .send:active { background: #1c5; }
  .navkeys { display: flex; gap: 6px; flex-wrap: wrap; }
  .navkeys button { min-width: 36px; height: 36px; padding: 0 8px; border-radius: 8px; background: rgba(28,28,28,.82);
                    color: #cde; border: 1px solid #3a3a3a; font-size: 14px; line-height: 1; cursor: pointer; }
  .navkeys button:active { background: rgba(64,64,64,.95); }
  .err { color: #f88; padding: 8px 12px; font-size: 12px; }
  .renameinput { width: 100%; background: #181818; color: #fff; border: 1px solid #356; border-radius: 3px; padding: 3px 6px; }
  .sentinel { height: 1px; }
  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 10; }
  .modal { background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; padding: 18px; width: min(420px, 92vw);
           display: flex; flex-direction: column; gap: 12px; }
  .modal h2 { margin: 0; font-size: 16px; color: #8af; }
  .modal label { font-size: 12px; color: #aaa; display: block; margin-bottom: 4px; }
  .modal select, .modal input[type=text] { width: 100%; background: #181818; color: #fff;
           border: 1px solid #2a2a2a; border-radius: 4px; padding: 8px; }
  .modal .check { display: flex; align-items: center; gap: 8px; color: #ddd; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div id="app" :class="{ collapsed }" x-data="sidebar()" x-init="init()">

  <aside>
    <header @click="window.innerWidth <= 800 && toggleCollapse()" title="Tap to collapse the list (mobile)">
      <strong>agent-sessions</strong>
      <div style="display:flex; gap:6px; align-items:center;">
        <button class="topbtn" @click.stop="openNew()" type="button">+ New</button>
        <button class="iconbtn" @click.stop="showSettings=true" title="Settings" type="button">⚙</button>
        <button class="iconbtn" @click.stop="logout()" type="button">⎋</button>
      </div>
    </header>

    <div style="padding:8px 12px; display:flex; gap:6px;">
      <span class="chip" :class="{ on: !showArchived }" @click="setArchived(false)">Active</span>
      <span class="chip" :class="{ on: showArchived }" @click="setArchived(true)">Archived</span>
    </div>

    <div class="fbar">
      <input type="text" placeholder="Search titles…" x-model="q" @input="onSearchInput()"
             aria-label="Search session titles">
      <div class="selects">
        <select x-model="projectFilter" @change="reload()" aria-label="Filter by project">
          <option value="">All projects</option>
          <template x-for="p in facets.projects" :key="p">
            <option :value="p" x-text="shortCwd(p)"></option>
          </template>
        </select>
        <select x-show="facets.engines.length > 1" x-model="engineFilter" @change="reload()"
                aria-label="Filter by agent">
          <option value="">All agents</option>
          <template x-for="e in facets.engines" :key="e">
            <option :value="e" x-text="e"></option>
          </template>
        </select>
        <button class="iconbtn clear" type="button" title="Clear filters"
                x-show="q || projectFilter || engineFilter" @click="clearFilters()">✕</button>
      </div>
    </div>

    <template x-for="s in sessions" :key="s.id">
      <div class="row" :class="{ sticky: s.sticky, current: current && current.id === s.id }" @click="open(s)">
        <div class="body">
          <template x-if="editing !== s.id">
            <div class="title">
              <span class="dot" x-show="now - s.last_mtime < 45" title="AI active — recent output"></span>
              <template x-if="facets.engines.length > 1"><span class="ebadge" :class="s.engine" x-text="s.engine === 'opencode' ? 'oc' : 'cc'"></span></template>
              <span x-text="s.title || '(untitled)'"></span>
            </div>
          </template>
          <template x-if="editing === s.id">
            <input class="renameinput" type="text" x-model="editTitle"
                   @click.stop @keydown.enter.stop="commitRename(s)" @keydown.escape.stop="editing=null"
                   @blur="commitRename(s)" x-init="$nextTick(()=>$el.focus())">
          </template>
          <div class="meta" :title="s.cwd" x-text="shortCwd(s.cwd) + ' • ' + ago(s.last_mtime)"></div>
        </div>
        <div class="acts" @click.stop>
          <button class="iconbtn" @click="startRename(s)" title="Rename">✎</button>
          <template x-if="!showArchived">
            <button class="iconbtn" @click="archive(s)" title="Archive">🗄</button>
          </template>
          <template x-if="showArchived">
            <button class="iconbtn" @click="unarchive(s)" title="Unarchive">↩</button>
          </template>
        </div>
      </div>
    </template>

    <template x-if="!loading && sessions.length === 0">
      <div class="empty"
           x-text="(q || projectFilter || engineFilter) ? 'No sessions match — clear filters.' : (showArchived ? 'No archived sessions.' : 'No sessions yet.')"></div>
    </template>

    <div class="sentinel" x-ref="sentinel"></div>
    <template x-if="loading"><div class="meta" style="padding:10px 12px;">loading…</div></template>
    <template x-if="err"><div class="err" x-text="err"></div></template>
  </aside>

  <div class="term">
    <div class="termbar" @click="toggleCollapse()" title="Show / hide the session list">
      <span class="hb" aria-hidden="true">☰</span>
      <template x-if="current"><span class="ebadge" :class="current.engine" x-text="current.engine === 'opencode' ? 'oc' : 'cc'"></span></template>
      <span class="t" :class="{ muted: !current }"
            x-text="current ? current.title : 'agent-main · tap here for the session list'"></span>
    </div>
    <div class="termwrap"><iframe x-ref="term" src="/terminal/" title="agent-main"></iframe></div>
    <div class="scrollstrip" @mousedown.prevent="startStripDrag($event)" title="Drag to scroll the session"></div>
    <button class="compose-toggle" x-show="!composeOpen" @click="toggleCompose()" type="button"
            aria-label="Compose + keys" title="Compose a message (autocomplete-safe) + nav keys">✎</button>
    <div class="compose" :class="{ open: composeOpen }">
      <div class="compose-head">
        <template x-if="attachments.length">
          <div class="pills">
            <template x-for="(a, i) in attachments" :key="a.path">
              <span class="pill" :title="a.path"><span class="pn" x-text="a.name"></span><button @click="attachments.splice(i, 1)" type="button" aria-label="Remove attachment">×</button></span>
            </template>
          </div>
        </template>
        <span class="spacer"></span>
        <button class="xclose" @click="toggleCompose()" type="button" aria-label="Close compose box" title="Close">✕</button>
      </div>
      <textarea x-ref="composeInput" x-model="composeText" rows="2" @paste="onComposePaste"
                @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); sendCompose(); }"
                placeholder="Type here (autocomplete works) — Enter sends, Shift+Enter = newline. /commands run as typed."></textarea>
      <div class="crow">
        <div class="navkeys">
          <button @click="termKey('up')" type="button" aria-label="Up" title="Up">↑</button>
          <button @click="termKey('down')" type="button" aria-label="Down" title="Down">↓</button>
          <button @click="termKey('enter')" type="button" aria-label="Enter" title="Enter">⏎</button>
          <button @click="termKey('esc')" type="button" aria-label="Escape" title="Escape">esc</button>
          <button @click="termKey('tab')" type="button" aria-label="Tab" title="Tab">⇥</button>
          <button @click="termKey('ctrlc')" type="button" aria-label="Ctrl-C" title="Ctrl-C">^C</button>
          <button @click="$refs.fileInput.click()" type="button" aria-label="Attach file"
                  title="Attach an image or file (added to your message)">📎</button>
        </div>
        <span class="spacer"></span>
        <button class="send" @click="sendCompose()" type="button" title="Paste into the session + Enter">Send</button>
      </div>
    </div>
    <input type="file" x-ref="fileInput" @change="onFilePick" multiple style="display:none">
    <template x-if="notice"><div class="upnotice" x-text="notice" @click="notice=null"></div></template>
  </div>

  <!-- New-session modal -->
  <template x-if="showModal">
    <div class="modal-bg" @click.self="showModal=false">
      <div class="modal">
        <h2>New session</h2>
        <div>
          <label>Project folder</label>
          <select x-model="newCwd">
            <template x-for="p in projects" :key="p.cwd">
              <option :value="p.cwd" x-text="p.label"></option>
            </template>
          </select>
        </div>
        <div>
          <label>Session name</label>
          <input type="text" x-model="newName" placeholder="e.g. refactor auth" @keydown.enter="createNew()">
        </div>
        <label class="check">
          <input type="checkbox" x-model="newBypass">
          bypass permissions (skip trust + tool prompts)
        </label>
        <div class="actions">
          <button class="iconbtn" @click="showModal=false">Cancel</button>
          <button class="topbtn" @click="createNew()" :disabled="!newCwd">Create</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Settings modal -->
  <template x-if="showSettings">
    <div class="modal-bg" @click.self="showSettings=false">
      <div class="modal">
        <h2>Settings</h2>
        <div>
          <label>Terminal scale — <span x-text="Math.round(scale*100)+'%'"></span></label>
          <input type="range" min="0.6" max="1.3" step="0.05" x-model.number="scale"
                 @input="persistScale(); applyScale()" style="width:100%">
          <div style="font-size:11px; color:#888; margin-top:4px;">
            Smaller = more columns (helps wide tables / code fit on a phone). Resyncs the terminal.
          </div>
        </div>
        <div class="actions">
          <button class="iconbtn" @click="scale=1; persistScale(); applyScale()" type="button">Reset</button>
          <button class="topbtn" @click="showSettings=false" type="button">Done</button>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
const CSRF = {{ csrf | tojson }};
const PAGE = 20;
function sidebar() {
  return {
    sessions: [], projects: [], err: null, notice: null, _noticeT: null, loading: false,
    composeOpen: localStorage.getItem('as_compose') !== '0', composeText: '',  // open by default; remembers if closed
    attachments: [],  // {name, path} pills for files attached to the draft
    scale: (parseFloat(localStorage.getItem('as_scale')) || 1), showSettings: false,  // terminal zoom
    now: Math.floor(Date.now() / 1000), _tick: null,  // drives the "AI active" dot (recent output)
    nextOffset: 0, showArchived: false,
    q: '', projectFilter: '', engineFilter: '', facets: { projects: [], engines: [] },
    collapsed: localStorage.getItem('as_collapsed') === '1',
    editing: null, editTitle: '',
    showModal: false, newCwd: '', newName: '', newBypass: true,
    // The session this terminal is currently showing (set when you open one from
    // the sidebar; persisted so it survives a reload). {id, title, engine} | null.
    current: (() => { try { return JSON.parse(localStorage.getItem('as_current') || 'null'); } catch (_) { return null; } })(),
    _obs: null, _searchT: null, _gen: 0, _hiddenAt: 0,

    async init() {
      await this.reload();
      this._obs = new IntersectionObserver((es) => {
        if (es[0].isIntersecting) this.loadMore();
      }, { root: this.$root, rootMargin: '200px' });
      this.$nextTick(() => this._obs.observe(this.$refs.sentinel));
      this.$nextTick(() => this.applyScale());                                  // apply persisted terminal scale
      if (this.$refs.term) this.$refs.term.addEventListener('load', () => this.applyScale());  // re-apply after reconnect-reload
      // Keep the "AI active" dots fresh: re-tick `now` and re-pull mtimes for loaded rows.
      this._tick = setInterval(() => { this.now = Math.floor(Date.now() / 1000); this.refreshActivity(); }, 12000);
      // When the desktop regains focus/visibility (e.g. after driving the session
      // from a phone, which shrinks the shared Zellij grid to the smaller width),
      // nudge the terminal to re-fit so it reclaims the full screen.
      window.addEventListener('focus', () => this.refit());
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') { this._hiddenAt = Date.now(); return; }
        // Back in the app. ttyd (1.7.7, no auto-reconnect) drops its WebSocket when the
        // tab is backgrounded a while, then waits on "press Enter to reconnect" — so
        // after a real background gap, reload the iframe to reconnect automatically;
        // for a quick flick, just refit. The Zellij session persists either way.
        const gap = this._hiddenAt ? Date.now() - this._hiddenAt : 0;
        if (gap > 8000) this.reconnectTerm(); else this.refit();
      });
      this.wireTouchScroll();
      this.wireUpload();
      // Keep the app sized to the *visible* viewport so the on-screen keyboard
      // doesn't hide the terminal's bottom (the prompt you're typing on).
      // visualViewport.height shrinks when the keyboard opens; bind #app to it and
      // the terminal reflows (the iframe resizes with its grid cell). Falls back to
      // the dvh CSS where visualViewport is unavailable.
      if (window.visualViewport) {
        const vv = window.visualViewport;
        const fitViewport = () => { this.$root.style.height = vv.height + 'px'; };
        vv.addEventListener('resize', fitViewport);
        fitViewport();
      }
    },
    async reload() {
      // Bump the generation so any in-flight page load is discarded, clear the
      // accumulated rows, and fetch from the top of the (possibly filtered) set.
      const gen = ++this._gen;
      this.sessions = []; this.nextOffset = 0; this.err = null;
      await this._fetchPage(gen);
    },
    async loadMore() {
      if (this.loading || this.nextOffset === null) return;
      await this._fetchPage(this._gen);
    },
    async _fetchPage(gen) {
      if (this.nextOffset === null) return;
      this.loading = true;
      try {
        const params = new URLSearchParams({ limit: PAGE, offset: this.nextOffset,
                                             archived: this.showArchived ? 1 : 0 });
        if (this.q.trim()) params.set('q', this.q.trim());
        if (this.projectFilter) params.set('project', this.projectFilter);
        if (this.engineFilter) params.set('engine', this.engineFilter);
        const r = await fetch(`/api/sessions?${params.toString()}`, { credentials: 'same-origin' });
        if (!r.ok) throw new Error('GET /api/sessions ' + r.status);
        const d = await r.json();
        if (gen !== this._gen) return;  // a newer reload superseded this fetch
        this.sessions.push(...d.sessions);
        this.nextOffset = d.next_offset;
        if (d.facets) this.facets = d.facets;
      } catch (e) { if (gen === this._gen) this.err = e.message; }
      finally { if (gen === this._gen) this.loading = false; }
    },
    async refreshActivity() {
      // Re-pull last_mtime for the loaded rows (no reorder / no scroll change) so the
      // "AI active" dots appear/disappear as sessions start/stop producing output.
      if (this.loading || !this.sessions.length) return;
      try {
        const params = new URLSearchParams({ limit: Math.min(this.sessions.length, 200), offset: 0,
                                             archived: this.showArchived ? 1 : 0 });
        if (this.q.trim()) params.set('q', this.q.trim());
        if (this.projectFilter) params.set('project', this.projectFilter);
        if (this.engineFilter) params.set('engine', this.engineFilter);
        const r = await fetch(`/api/sessions?${params.toString()}`, { credentials: 'same-origin' });
        if (!r.ok) return;
        const fresh = {};
        for (const s of (await r.json()).sessions) fresh[s.id] = s.last_mtime;
        for (const s of this.sessions) if (s.id in fresh) s.last_mtime = fresh[s.id];
      } catch (_) { /* ignore transient errors */ }
    },
    setArchived(v) {
      if (v === this.showArchived) return;
      // project/engine option lists are scope-specific; reset them on toggle
      // (keep the title query, which applies across both scopes).
      this.showArchived = v; this.projectFilter = ''; this.engineFilter = ''; this.reload();
    },
    onSearchInput() { clearTimeout(this._searchT); this._searchT = setTimeout(() => this.reload(), 250); },
    clearFilters() { this.q = ''; this.projectFilter = ''; this.engineFilter = ''; this.reload(); },

    async post(url, body) {
      const r = await fetch(url, { method: 'POST', credentials: 'same-origin',
        headers: { 'X-CSRF-Token': CSRF, 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined });
      if (!r.ok) throw new Error(url + ' ' + r.status + ': ' + await r.text());
      return r;
    },
    async open(s) {
      try {
        await this.post(`/api/sessions/${encodeURIComponent(s.id)}/open`);
        this.current = { id: s.id, title: s.title || '(untitled)', engine: s.engine };
        localStorage.setItem('as_current', JSON.stringify(this.current));
        if (this.collapsed === false && window.innerWidth <= 800) this.collapsed = true;
      } catch (e) { this.err = e.message; }
    },
    startRename(s) { this.editing = s.id; this.editTitle = s.title || ''; },
    async commitRename(s) {
      if (this.editing !== s.id) return;
      const t = this.editTitle.trim(); this.editing = null;
      if (!t || t === s.title) return;
      try {
        await this.post(`/api/sessions/${encodeURIComponent(s.id)}/rename`, { title: t });
        s.title = t;
        if (this.current && this.current.id === s.id) {
          this.current.title = t;
          localStorage.setItem('as_current', JSON.stringify(this.current));
        }
      } catch (e) { this.err = e.message; }
    },
    async archive(s) { try { await this.post(`/api/sessions/${encodeURIComponent(s.id)}/archive`); this.sessions = this.sessions.filter(x => x.id !== s.id); } catch (e) { this.err = e.message; } },
    async unarchive(s) { try { await this.post(`/api/sessions/${encodeURIComponent(s.id)}/unarchive`); this.sessions = this.sessions.filter(x => x.id !== s.id); } catch (e) { this.err = e.message; } },

    async openNew() {
      this.showModal = true; this.newName = ''; this.newBypass = true;
      try {
        const r = await fetch('/api/projects', { credentials: 'same-origin' });
        this.projects = (await r.json()).projects;
        if (this.projects.length && !this.newCwd) this.newCwd = this.projects[0].cwd;
      } catch (e) { this.err = e.message; }
    },
    async createNew() {
      if (!this.newCwd) return;
      const name = this.newName || 'session';
      try {
        await this.post('/api/projects/new', { cwd: this.newCwd, name, bypass_permissions: this.newBypass });
        this.showModal = false;
        // The terminal switched to the new tab — reflect it in the header right away.
        // (A brand-new session has no id until claude writes its JSONL, so id is null.)
        this.current = { id: null, title: name, engine: 'claude' };
        localStorage.setItem('as_current', JSON.stringify(this.current));
        if (window.innerWidth <= 800) this.collapsed = true;
        // claude writes the JSONL a beat after start — reload a couple of times so the
        // new session appears in the list without a manual refresh.
        setTimeout(() => this.reload(), 1500);
        setTimeout(() => this.reload(), 4000);
      } catch (e) { this.err = e.message; }
    },

    reconnectTerm() {
      // Reload the ttyd iframe to re-establish its WebSocket (auto-reconnect). The
      // Zellij `agent-main` session persists server-side, so output/state is intact
      // on re-attach — this just skips the manual "press Enter to reconnect".
      const f = this.$refs.term;
      if (!f) return;
      try { f.contentWindow.location.reload(); } catch (e) { f.src = f.src; }
    },
    persistScale() { localStorage.setItem('as_scale', String(this.scale)); },
    applyScale() {
      // Oversize the iframe then shrink it with a CSS transform, so xterm sees a larger
      // viewport (more columns/rows) rendered smaller. <1 = more columns — helps wide
      // tables/code fit on a phone. .termwrap clips the overflow; the flex layout (compose
      // box) is untouched; xterm re-fits on the size change.
      const f = this.$refs.term;
      if (!f) return;
      const s = this.scale || 1;
      if (s === 1) { f.style.transform = ''; f.style.width = '100%'; f.style.height = '100%'; return; }
      f.style.width = (100 / s) + '%';
      f.style.height = (100 / s) + '%';
      f.style.transform = 'scale(' + s + ')';
    },
    refit() {
      // Force ttyd/xterm to recompute cols/rows by briefly nudging the iframe
      // height: the inner window's resize handler re-fits and pushes the new size
      // to Zellij, so the desktop reclaims width a smaller device left behind.
      // (fit() measures both dimensions, so a height nudge also restores width.)
      const f = this.$refs.term;
      if (!f) return;
      f.style.height = 'calc(100% - 1px)';
      setTimeout(() => { f.style.height = ''; }, 80);
    },
    _wheel(deltaY) {
      // Dispatch one wheel event (pixel delta) into the same-origin terminal iframe.
      // Zellij's mouse mode is on, so xterm forwards wheel to it as scroll;
      // deltaY<0 = up (older output). Passing the *real* px delta (instead of fixed
      // notches) lets a swipe track the finger rather than lurch ahead.
      const f = this.$refs.term;
      try {
        const doc = f.contentDocument, win = doc.defaultView;
        const el = doc.querySelector('.xterm-screen') || doc.querySelector('.xterm') || doc.body;
        el.dispatchEvent(new win.WheelEvent('wheel',
          { deltaY, deltaMode: 0, bubbles: true, cancelable: true }));
      } catch (e) { this.err = 'terminal scroll unavailable'; }
    },
    startStripDrag(e) {
      // Desktop: grab the right-edge strip and drag to scroll the session — drag down
      // scrolls toward the latest output, up toward older (scrollbar semantics). Feeds
      // Zellij via _wheel with the real drag delta. Window-level listeners so the drag
      // keeps working off the strip; removed on mouseup.
      let lastY = e.clientY, acc = 0;
      const move = (ev) => {
        acc += ev.clientY - lastY; lastY = ev.clientY; // down(+)=newer; up(-)=older
        if (Math.abs(acc) >= 12) { this._wheel(acc); acc = 0; }
      };
      const up = () => {
        window.removeEventListener('mousemove', move);
        window.removeEventListener('mouseup', up);
      };
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', up);
    },
    termKey(name) {
      // Mobile nav keys → inject a keydown into the session so TUI menus (e.g.
      // Claude's resume prompt) are operable without a hardware keyboard.
      const K = {
        up:    { key: 'ArrowUp',   code: 'ArrowUp',   keyCode: 38 },
        down:  { key: 'ArrowDown', code: 'ArrowDown', keyCode: 40 },
        enter: { key: 'Enter',     code: 'Enter',     keyCode: 13 },
        esc:   { key: 'Escape',    code: 'Escape',    keyCode: 27 },
        tab:   { key: 'Tab',       code: 'Tab',       keyCode: 9 },
        ctrlc: { key: 'c',         code: 'KeyC',      keyCode: 67, ctrlKey: true },
        ctrlu: { key: 'u',         code: 'KeyU',      keyCode: 85, ctrlKey: true },
      }[name];
      if (K) this._key(K);
    },
    _key(o) {
      // Dispatch a synthetic keydown into the same-origin terminal iframe; xterm's
      // key handler turns it into the right escape sequence and sends it to the PTY.
      // Same same-origin-DOM approach as _wheel — no ttyd/xterm patching.
      const f = this.$refs.term;
      try {
        const doc = f.contentDocument, win = doc.defaultView;
        const el = doc.querySelector('.xterm-helper-textarea') || doc.querySelector('.xterm-screen')
                 || doc.querySelector('.xterm') || doc.body;
        if (el.focus) el.focus();
        const ev = new win.KeyboardEvent('keydown',
          { key: o.key, code: o.code, ctrlKey: !!o.ctrlKey, bubbles: true, cancelable: true });
        // keyCode/which aren't settable via the constructor but some xterm paths
        // still read them — expose them so special keys map correctly.
        try {
          Object.defineProperty(ev, 'keyCode', { get: () => o.keyCode });
          Object.defineProperty(ev, 'which', { get: () => o.keyCode });
        } catch (_) { /* ignore */ }
        el.dispatchEvent(ev);
      } catch (e) { this.err = 'terminal keys unavailable'; }
    },
    onFilePick(e) {
      const toCompose = this.composeOpen;
      for (const file of e.target.files) this.uploadFile(file, toCompose);
      e.target.value = ''; // allow re-picking the same file
    },
    async uploadFile(file, toCompose = false) {
      // Upload a pasted/dropped/picked file; the server saves it under
      // ~/.agent-sessions/uploads/ and returns a path a session can read. With the
      // compose box open the path is appended to the draft; otherwise it's pasted
      // straight into the terminal prompt (+ copied to the clipboard).
      try {
        const fd = new FormData();
        fd.append('file', file, file.name || 'pasted');
        const r = await fetch('/api/upload', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'X-CSRF-Token': CSRF }, body: fd,
        });
        if (!r.ok) throw new Error(r.status + ': ' + await r.text());
        const { path } = await r.json();
        if (toCompose) {
          this.attachments.push({ name: path.split('/').pop(), path }); // shown as a pill, not inline text
          this.showNotice('📎 attached ' + path.split('/').pop());
        } else {
          this._pasteText(path + ' ');                      // drop the path at the prompt
          try { await navigator.clipboard.writeText(path); } catch (_) { /* notice still shows it */ }
          this.showNotice('📎 ' + path + '  — path inserted + copied');
        }
      } catch (e) { this.err = 'upload failed — ' + e.message; }
    },
    toggleCompose() {
      this.composeOpen = !this.composeOpen;
      localStorage.setItem('as_compose', this.composeOpen ? '1' : '0');
      if (this.composeOpen) this.$nextTick(() => { try { this.$refs.composeInput.focus(); } catch (_) { /* */ } });
    },
    sendCompose() {
      // Build the message from the trimmed draft + any attached file paths, clear the
      // prompt line first (Ctrl-U) so it doesn't mix with leftover input, then paste in
      // one shot + Enter. One bracketed paste = no per-keystroke IME garble. Clear draft
      // + pills only AFTER the paste lands (it can need retries right after a reconnect),
      // so nothing is silently lost. /commands run as typed; for the native /-menu, type
      // '/' here, Send, then drive it with the nav keys.
      const parts = [];
      if (this.composeText.trim()) parts.push(this.composeText.trim());
      for (const a of this.attachments) parts.push(a.path);
      const t = parts.join(' ');
      if (!t) return;                              // nothing to send (no text, no attachments)
      this.termKey('ctrlu');                       // wipe any existing text at the prompt
      this._pasteText(t, () => {
        this.composeText = '';
        this.attachments = [];
        setTimeout(() => {
          this.termKey('enter');                       // submit once xterm has ingested the paste
          // ...then take the cursor BACK to the box so you can keep typing. Must come
          // after termKey — _key() focuses the terminal, which would otherwise steal it.
          try { this.$refs.composeInput.focus(); } catch (_) { /* */ }
        }, 200);  // give the bracketed paste time to land first, else the Enter is dropped (text stays unsubmitted)
      });
    },
    _clipFiles(dt) {
      // Pull pasted/dropped file(s) from a DataTransfer. Browsers vary: some put a
      // pasted image in .files, others only in .items (kind 'file') — check both, so
      // an image paste is caught and uploaded instead of falling through to Claude
      // (which runs server-side and can't see the browser clipboard → "no image found").
      const out = [];
      if (!dt) return out;
      if (dt.files && dt.files.length) { for (const f of dt.files) out.push(f); }
      if (!out.length && dt.items) {
        for (const it of dt.items) {
          if (it.kind === 'file') { const f = it.getAsFile(); if (f) out.push(f); }
        }
      }
      return out;
    },
    onComposePaste(e) {
      // Image/file pasted into the draft → upload + append its path; text falls through.
      const files = this._clipFiles(e.clipboardData);
      if (files.length) {
        e.preventDefault();
        for (const f of files) this.uploadFile(f, true);
      }
    },
    showNotice(msg) {
      this.notice = msg;
      clearTimeout(this._noticeT);
      this._noticeT = setTimeout(() => { this.notice = null; }, 7000);
    },
    _pasteText(text, after) {
      // Inject text into xterm via a synthetic paste on its helper textarea. Right
      // after a reload (e.g. auto-reconnect) xterm may not be mounted yet, so retry
      // briefly until the textarea exists, then run `after` (e.g. press Enter). If it
      // never appears, copy to the clipboard + notify so the text isn't lost.
      const f = this.$refs.term;
      let tries = 0;
      const attempt = () => {
        let el = null, win = null;
        try {
          const doc = f.contentDocument; win = doc.defaultView;
          el = doc.querySelector('.xterm-helper-textarea');
        } catch (_) { /* iframe not ready */ }
        if (el && win) {
          el.focus();
          const dt = new win.DataTransfer();
          dt.setData('text/plain', text);
          el.dispatchEvent(new win.ClipboardEvent('paste',
            { clipboardData: dt, bubbles: true, cancelable: true }));
          if (after) after();
          return;
        }
        if (tries++ < 12) { setTimeout(attempt, 60); return; } // ~0.7s of retries while xterm boots
        try { navigator.clipboard.writeText(text); } catch (_) { /* */ }
        this.showNotice('terminal not ready — text copied, paste it manually');
      };
      attempt();
    },
    wireUpload() {
      // Paste an image or drop a file onto the terminal → upload it. Plain-text paste
      // still falls through to xterm. Same iframe-doc wiring as the touch handlers.
      const f = this.$refs.term;
      const wire = () => {
        let doc;
        try { doc = f.contentDocument; } catch (e) { return; }
        if (!doc || doc._asUploadWired) return;
        doc._asUploadWired = true;
        doc.addEventListener('paste', (e) => {
          const files = this._clipFiles(e.clipboardData);
          if (files.length) { // image/file paste → upload (text paste falls through)
            e.preventDefault(); e.stopPropagation();
            for (const file of files) this.uploadFile(file);
          }
        }, { capture: true });
        doc.addEventListener('dragover', (e) => { e.preventDefault(); }, { capture: true });
        doc.addEventListener('drop', (e) => {
          const files = this._clipFiles(e.dataTransfer);
          if (files.length) {
            e.preventDefault(); e.stopPropagation();
            for (const file of files) this.uploadFile(file);
          }
        }, { capture: true });
      };
      wire();
      f.addEventListener('load', wire);
    },
    wireTouchScroll() {
      // Translate a one-finger vertical swipe over the terminal into wheel events
      // (the same wheel path the desktop drag-strip uses) so mobile scrolls by dragging,
      // with native-feeling momentum: a flick glides and decays, and any touch stops
      // it. touchmove is captured + stopped so it doesn't also reach xterm as a mouse
      // drag (which would start a text selection); touchstart/end pass through so
      // tap-to-focus / keyboard still work. Multi-finger gestures are left alone.
      // Same-origin DOM only — no ttyd/xterm patching.
      const f = this.$refs.term;
      let momRAF = null;
      const stopMomentum = () => { if (momRAF) { cancelAnimationFrame(momRAF); momRAF = null; } };
      const attach = () => {
        let doc;
        try { doc = f.contentDocument; } catch (e) { return; }
        if (!doc || doc._asTouchWired) return;
        doc._asTouchWired = true;
        let lastY = null, acc = 0, lastT = 0, vel = 0; // vel: smoothed px/ms (+ = newer/down)
        doc.addEventListener('touchstart', (e) => {
          stopMomentum(); // any touch halts a glide in progress
          lastY = e.touches.length === 1 ? e.touches[0].clientY : null;
          acc = 0; vel = 0; lastT = performance.now();
        }, { passive: true });
        doc.addEventListener('touchmove', (e) => {
          if (lastY === null || e.touches.length !== 1) return; // multi-finger: leave alone
          const y = e.touches[0].clientY, now = performance.now();
          const d = lastY - y; // +d = drag up (newer/down); -d = drag down (older/up)
          acc += d; lastY = y;
          const dt = Math.max(now - lastT, 1); lastT = now;
          vel = 0.8 * vel + 0.2 * (d / dt); // low-pass the finger velocity
          if (Math.abs(acc) >= 16) { this._wheel(acc); acc = 0; } // real px → tracks the finger
          e.preventDefault(); e.stopPropagation();
        }, { passive: false, capture: true });
        doc.addEventListener('touchend', () => {
          lastY = null;
          if (Math.abs(vel) < 0.4) return; // not a flick → no glide
          let v = vel, prevT = performance.now(), mAcc = 0;
          const step = () => {
            const now = performance.now(), dt = Math.min(now - prevT, 32); prevT = now;
            mAcc += v * dt;
            if (Math.abs(mAcc) >= 16) { this._wheel(mAcc); mAcc = 0; }
            v *= Math.pow(0.95, dt / 16); // friction (~per frame); glides for ~1s
            momRAF = Math.abs(v) > 0.04 ? requestAnimationFrame(step) : null;
          };
          momRAF = requestAnimationFrame(step);
        }, { passive: true });
      };
      attach();
      f.addEventListener('load', attach);
    },
    toggleCollapse() { this.collapsed = !this.collapsed; localStorage.setItem('as_collapsed', this.collapsed ? '1' : '0'); },
    shortCwd(c) { return (c || '').replace(/^\/home\/[^/]+\//, '~/'); },
    ago(ts) {
      const s = Math.max(0, Date.now()/1000 - ts);
      if (s < 3600) return Math.floor(s/60) + 'm ago';
      if (s < 86400) return Math.floor(s/3600) + 'h ago';
      return Math.floor(s/86400) + 'd ago';
    },
    async logout() { try { const r = await this.post('/logout'); if (r.redirected) location.href = r.url; else location.href='/login'; } catch (e) { this.err = e.message; } },
  };
}
</script>
</body>
</html>
