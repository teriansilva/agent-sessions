<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agent-sessions — change password</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center;
           background: #0e0e0e; color: #eee; font: 14px ui-sans-serif, system-ui, sans-serif; }
    form { background: #111; border: 1px solid #222; padding: 22px; border-radius: 6px;
           display: flex; flex-direction: column; gap: 10px; width: 280px; }
    h1 { font-size: 16px; margin: 0 0 2px; color: #4a90d9; }
    p.hint { margin: 0; font-size: 12px; color: #9a9a9a; }
    input { background: #181818; color: #fff; border: 1px solid #333; border-radius: 5px;
            padding: 9px 10px; font: inherit; }
    button { background: #1a8a4a; color: #fff; border: 0; border-radius: 5px; padding: 10px;
             font: inherit; font-weight: 600; cursor: pointer; }
    .err { color: #f3b0b0; font-size: 12px; }
  </style>
</head>
<body>
<form method="post" action="/change-password" autocomplete="on">
  <h1>Set a new password</h1>
  <p class="hint">Choose a password to replace the generated one (min 8 characters).</p>
  <input name="current" type="password" placeholder="current password" autocomplete="current-password" required>
  <input name="new" type="password" placeholder="new password" autocomplete="new-password" required>
  <input name="confirm" type="password" placeholder="confirm new password" autocomplete="new-password" required>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <button type="submit">Save</button>
</form>
</body>
</html>
