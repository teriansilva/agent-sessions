<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BattleLab — set a password</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d0e10; color: #e8e9ec;
               font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
               display: grid; place-items: center; }
  form { background: #131418; border: 1px solid rgba(255,255,255,.1); padding: 24px; border-radius: 12px;
         min-width: 290px; display: flex; flex-direction: column; gap: 10px; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; color: #e8e9ec; letter-spacing: -.2px; }
  h1 b { color: #ffb000; }
  .tagline { margin: 0 0 8px; font-size: 12.5px; letter-spacing: .12em; color: #a7abb3; }
  .hint { margin: -2px 0 4px; font-size: 12px; color: #a7abb3; }
  input { background: #0d0e10; color: #e8e9ec; border: 1px solid rgba(255,255,255,.14);
          padding: 9px 11px; border-radius: 8px; font: inherit; }
  input:focus-visible { outline: none; border-color: #ffb000; }
  button { background: linear-gradient(100deg, #ffb000, #d99500); color: #120c00; border: 0; padding: 10px;
           border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer;
           position: relative; overflow: hidden; }
  button:hover { background: linear-gradient(100deg, #ffc94d, #e6a30f); }  /* dark-on-amber ~11:1 */
  /* White reflection sweep on the amber CTA (matches the login button). */
  button::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%);
    transform: translateX(-160%); animation: shine 7s ease-in-out infinite; }
  @keyframes shine { 0% { transform: translateX(-160%); } 18% { transform: translateX(160%); }
    100% { transform: translateX(160%); } }
  @media (prefers-reduced-motion: reduce) { button::after { animation: none; } }
  .err { color: #ff8a8a; font-size: 12px; }
</style>
</head>
<body>
<form method="post" action="/change-password" autocomplete="on">
  <h1>Battle<b>Lab</b></h1>
  <p class="tagline">Command &amp; Code</p>
  <p class="hint">Choose a password to replace the generated one (min 12 characters).</p>
  <input name="current" type="password" placeholder="current password" autocomplete="current-password" required>
  <input name="new" type="password" placeholder="new password" autocomplete="new-password" required>
  <input name="confirm" type="password" placeholder="confirm new password" autocomplete="new-password" required>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <button type="submit">Set password</button>
</form>
</body>
</html>
