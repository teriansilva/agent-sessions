<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>BattleLab — set a password</title>
<!-- NIGHTJAR (#1596): the app's own palette and primitives, emitted by web/scripts/emit-page-tokens.mjs,
     then this page family's layout. Before sign-in, no telemetry and no classification text. -->
<link rel="stylesheet" href="/static/nightjar/fonts.css">
<link rel="stylesheet" href="/static/nightjar/tokens.css">
<link rel="stylesheet" href="/static/nightjar/motion.css">
<link rel="stylesheet" href="/static/nightjar/nightjar.css">
<link rel="stylesheet" href="/static/nightjar/pages.css">
</head>
<body class="nj-page">
<div class="nj-atmo" aria-hidden="true"><i class="nj-hex"></i><i class="nj-scan"></i><i class="nj-noise"></i><i class="nj-sweep"></i><i class="nj-vig"></i></div>
<main class="page-shell">
<form class="nj-frame page-card page-form" method="post" action="/change-password" autocomplete="on">
  <h1 class="page-brand"><!-- brand:lockup-notag-dark --><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 368 64" class="brand-lockup" role="img" aria-label="BattleLab"><g transform="translate(0 0)"><path d="M14 0 H64 V50 L50 64 H0 V14 Z" fill="#FFB000"/><path d="M18 17 L33 32 L18 47" fill="none" stroke="#120C00" stroke-width="9" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10"/><rect x="37" y="40" width="13" height="7" fill="#120C00"/></g><path fill="#E8E9EC" d="M87.08 16.60000000000001H105.73599999999999L110.00399999999999 20.868000000000006V29.492000000000008L108.112 31.384000000000007L111.368 34.64000000000001V42.78000000000001L106.74799999999999 47.400000000000006H87.08ZM103.184 29.84400000000001 104.988 28.040000000000006V22.672000000000008L103.228 20.912000000000006H92.05199999999999V29.84400000000001ZM104.24 43.08800000000001 106.352 40.976000000000006V36.04800000000001L104.24 33.980000000000004H92.05199999999999V43.08800000000001Z M130.024 16.60000000000001H134.864L145.996 47.400000000000006H140.804L138.164 40.096000000000004H126.68L124.04 47.400000000000006H118.848ZM136.976 35.828 132.444 22.804000000000006H132.356L127.912 35.828Z M161.836 20.956000000000007H152.596V16.60000000000001H176.18V20.956000000000007H166.94V47.400000000000006H161.836Z M192.46 20.956000000000007H183.22V16.60000000000001H206.804V20.956000000000007H197.564V47.400000000000006H192.46Z M216.044 16.60000000000001H221.148V43.044000000000004H236.636V47.400000000000006H216.044Z M245.656 16.60000000000001H267.128V20.956000000000007H250.76V29.756000000000007H265.852V34.068000000000005H250.76V43.044000000000004H267.128V47.400000000000006H245.656Z"/><path fill="#FFB000" d="M277.24799999999993 16.60000000000001H282.352V43.044000000000004H297.8399999999999V47.400000000000006H277.24799999999993Z M315.3959999999999 16.60000000000001H320.23599999999993L331.36799999999994 47.400000000000006H326.17599999999993L323.53599999999994 40.096000000000004H312.0519999999999L309.4119999999999 47.400000000000006H304.2199999999999ZM322.3479999999999 35.828 317.8159999999999 22.804000000000006H317.7279999999999L313.28399999999993 35.828Z M340.1679999999999 16.60000000000001H358.8239999999999L363.0919999999999 20.868000000000006V29.492000000000008L361.19999999999993 31.384000000000007L364.4559999999999 34.64000000000001V42.78000000000001L359.8359999999999 47.400000000000006H340.1679999999999ZM356.27199999999993 29.84400000000001 358.0759999999999 28.040000000000006V22.672000000000008L356.3159999999999 20.912000000000006H345.13999999999993V29.84400000000001ZM357.3279999999999 43.08800000000001 359.4399999999999 40.976000000000006V36.04800000000001L357.3279999999999 33.980000000000004H345.13999999999993V43.08800000000001Z"/></svg><!-- /brand:lockup-notag-dark --></h1>
  <p class="nj-callsign page-callsign"><span class="nj-notch" aria-hidden="true"></span>Secure terminal // <span class="nj-value">Provision</span><span class="nj-meta"><span class="hud-led up" aria-hidden="true"></span></span></p>
  <h2 class="page-title">Set your password<span class="nj-caret" aria-hidden="true"></span></h2>
  <p class="page-hint">Choose a password to replace the generated one (min 12 characters).</p>
  <label class="page-field"><span class="page-label">Current password</span><input class="nj-field is-mono" name="current" type="password" placeholder="current password" autocomplete="current-password" required></label>
  <label class="page-field"><span class="page-label">New password</span><input class="nj-field is-mono" name="new" type="password" placeholder="new password" autocomplete="new-password" required></label>
  <label class="page-field"><span class="page-label">Confirm password</span><input class="nj-field is-mono" name="confirm" type="password" placeholder="confirm new password" autocomplete="new-password" required></label>
  {% if error %}<p class="page-error" role="alert"><span class="hud-led down" aria-hidden="true"></span>{{ error }}</p>{% endif %}
  <button class="nj-plate page-btn" type="submit">Set password</button>
</form>
</main>
</body>
</html>
