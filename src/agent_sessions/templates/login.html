<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>agent-sessions — login</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #e6e6e6;
               font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
               display: grid; place-items: center; }
  form { background: #111; border: 1px solid #222; padding: 22px; border-radius: 6px;
         min-width: 280px; display: flex; flex-direction: column; gap: 10px; }
  h1 { margin: 0 0 8px; font-size: 18px; color: #8af; }
  input { background: #181818; color: #fff; border: 1px solid #2a2a2a;
          padding: 8px 10px; border-radius: 3px; font: inherit; }
  button { background: #1a4; color: #fff; border: 0; padding: 9px;
           border-radius: 3px; font: inherit; cursor: pointer; }
  button:hover { background: #1c5; }
  .err { color: #f88; font-size: 12px; }
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="on">
  <h1>agent-sessions</h1>
  <input name="username" type="text" placeholder="username" autocomplete="username" required>
  <input name="password" type="password" placeholder="password" autocomplete="current-password" required>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <button type="submit">sign in</button>
</form>
</body>
</html>
