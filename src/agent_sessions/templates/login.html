<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TermRoyale — sign in</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d0820; color: #ece9f7;
               font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
               display: grid; place-items: center; }
  form { background: #14102e; border: 1px solid #2f2658; padding: 24px; border-radius: 12px;
         min-width: 290px; display: flex; flex-direction: column; gap: 10px; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; color: #ffe9a8; letter-spacing: -.2px; }
  h1 b { color: #f5c542; }
  .tagline { margin: 0 0 8px; font-size: 12.5px; font-style: italic; color: #9a8fcf; }
  input { background: #0d0820; color: #fff; border: 1px solid #2f2658;
          padding: 9px 11px; border-radius: 8px; font: inherit; }
  button { background: #7c4ddb; color: #fff; border: 0; padding: 10px;
           border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer;
           position: relative; overflow: hidden; }
  button:hover { background: #6d3ad0; }  /* darken on hover — stays >=4.5:1 with white */
  /* Gold reflection sweep (matches the in-app .shine CTAs). */
  button::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(110deg, transparent 35%, rgba(255,233,168,.5) 50%, transparent 65%);
    transform: translateX(-160%); animation: shine 7s ease-in-out infinite; }
  @keyframes shine { 0% { transform: translateX(-160%); } 18% { transform: translateX(160%); }
    100% { transform: translateX(160%); } }
  @media (prefers-reduced-motion: reduce) { button::after { animation: none; } }
  .err { color: #ff9a9a; font-size: 12px; }
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="on">
  <h1>👑 Term<b>Royale</b></h1>
  <p class="tagline">Finally, a terminal with some class.</p>
  <input type="hidden" name="next" value="{{ next }}">
  <input name="username" type="text" placeholder="username" autocomplete="username" required>
  <input name="password" type="password" placeholder="password" autocomplete="current-password" required>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <button type="submit">sign in</button>
</form>
</body>
</html>
